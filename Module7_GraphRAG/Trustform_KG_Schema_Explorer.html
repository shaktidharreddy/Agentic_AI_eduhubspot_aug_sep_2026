<script type="text/plain" id="ddl-text">// Run in Neo4j Browser. Run the two :use lines on their own.
:use system
CREATE DATABASE trustform IF NOT EXISTS WAIT;
:use trustform

// 1) One uniqueness constraint per label (also makes MERGE by key fast)
CREATE CONSTRAINT family_name      IF NOT EXISTS FOR (n:ProductFamily) REQUIRE n.name IS UNIQUE;
CREATE CONSTRAINT model_key        IF NOT EXISTS FOR (n:ProductModel)  REQUIRE n.key IS UNIQUE;
CREATE CONSTRAINT customer_name    IF NOT EXISTS FOR (n:Customer)      REQUIRE n.name IS UNIQUE;
CREATE CONSTRAINT questionnaire_id IF NOT EXISTS FOR (n:Questionnaire) REQUIRE n.id IS UNIQUE;
CREATE CONSTRAINT question_id      IF NOT EXISTS FOR (n:Question)      REQUIRE n.id IS UNIQUE;
CREATE CONSTRAINT answer_id        IF NOT EXISTS FOR (n:Answer)        REQUIRE n.id IS UNIQUE;
CREATE CONSTRAINT topic_code       IF NOT EXISTS FOR (n:Topic)         REQUIRE n.code IS UNIQUE;
CREATE CONSTRAINT source_sha       IF NOT EXISTS FOR (n:SourceFile)    REQUIRE n.sha256 IS UNIQUE;
CREATE CONSTRAINT standard_name    IF NOT EXISTS FOR (n:Standard)      REQUIRE n.name IS UNIQUE;
CREATE CONSTRAINT technology_name  IF NOT EXISTS FOR (n:Technology)    REQUIRE n.name IS UNIQUE;
CREATE CONSTRAINT submission_id    IF NOT EXISTS FOR (n:Submission)    REQUIRE n.submissionId IS UNIQUE;
CREATE CONSTRAINT draft_id         IF NOT EXISTS FOR (n:DraftAnswer)   REQUIRE n.id IS UNIQUE;

// 2) The ONLY vector index: on Answer, with product scope and status as in-index filters
//    (WITH [...] filter properties and SEARCH ... WHERE ... IN need Cypher 25 / Neo4j 2026.06+)
CYPHER 25
CREATE VECTOR INDEX answer_embedding IF NOT EXISTS
FOR (a:Answer) ON a.embedding
WITH [a.family, a.status]
OPTIONS { indexConfig: {
  `vector.dimensions`: 1536,
  `vector.similarity_function`: 'cosine',
  `vector.quantization.type`: 'none'
}};
// 1536 = EMBEDDING_DIMENSIONS of text-embedding-3-small; ~1,660 vectors, so no quantization needed

// 3) Lexical leg for hybrid retrieval (the job tsvector does in pgvector's RETRIEVAL_MODE=hybrid)
CREATE FULLTEXT INDEX answer_text IF NOT EXISTS
FOR (a:Answer) ON EACH [a.text]
OPTIONS { indexConfig: { `fulltext.analyzer`: 'english' } };

// 4) Lookups the app does by key
CREATE INDEX draft_submission IF NOT EXISTS FOR (d:DraftAnswer) ON (d.submissionId);
CREATE INDEX question_row     IF NOT EXISTS FOR (q:Question)    ON (q.rowIndex);

// 5) Check: everything ONLINE?
SHOW INDEXES YIELD name, type, state, labelsOrTypes, properties;</script>

<script type="text/plain" id="example-text">// Excel rows 676-678 of the datasheet (Ridgeview questionnaire, GeneXpert - GX16-16)
(:SourceFile {fileName: 'Updated Security QA_Datasheet_MARCH_2025_CLEAN.csv'})
(qn:Questionnaire {id: 'QN-13', rowStart: 634, rowEnd: 822, questionCount: 189, inferred: true})
(qn)-[:FROM_CUSTOMER {matchedAlias: 'Ridgeview', method: 'rule'}]->(:Customer {name: 'Ridgeview'})
(qn)-[:FOR_MODEL]->(:ProductModel {name: 'GeneXpert - GX16-16'})
    -[:BELONGS_TO]->(:ProductFamily {name: 'GeneXpert - GX', uiLabel: 'GeneXpert - GX'})

(q674:Question {id: 'Q-0674', rowIndex: 674, text: 'Do you currently have DLP tools installed?'})
(q674)-[:PART_OF {position: 41}]->(qn)
(q674)-[:ABOUT {method: 'rule'}]->(:Topic {code: 'PHI'})
(q674)-[:HAS_ANSWER]->(a674:Answer {id: 'A-0674', verdict: 'no', response: 'No',
    comment: 'No, Device is in customer network', stance: 'customer-responsibility',
    family: 'GeneXpert - GX', status: 'current', embedding: [...1536 floats]})
(a674)-[:EXTRACTED_FROM {excelRow: 676}]->(:SourceFile)

(q675:Question {text: 'If yes, which DLP tools are you using?'})
(q675)-[:FOLLOWS_UP {signal: 'if-yes'}]->(q674)     // no response, no comment: no Answer node

(q676:Question {text: 'If no, are you planning on implementing a DLP tool in the next 12 months?'})
(q676)-[:FOLLOWS_UP {signal: 'if-no'}]->(q674)      // parent = nearest earlier non-follow-up
(q676)-[:HAS_ANSWER]->(:Answer {verdict: 'no', comment: 'Device is in customer network',
    text: 'Question (follow-up to: Do you currently have DLP tools installed?): If no, ...'})</script>

const QUERIES = {
 q1: {title:'Capability 1 · Graph RAG retrieval',
  nodes:['answer','question','questionnaire','model','customer','topic','family'],
  edges:['has_answer','part_of_q','for_model','from_customer_qn','follows_up','about_q','inherits_from'],
  desc:`The Graph RAG version of <code>question_responder()</code>, live in <code>src/logic/neo4j_graph.py</code>. Vector search runs inside <code>answer_embedding</code> with the product scope as an in-index filter. Each hit is then expanded through the graph: who asked, for which model, and its parent if it is a conditional follow-up. <b>Shipped:</b> steps 1-4 and 6. <b>Step 5 was built and measured:</b> on 100 paraphrased questions it changed 0 results, because the index already returns the true top-k for 1,660 vectors and both hops rank by the same similarity. It ships behind <code>GRAPH_TOPIC_EXPANSION=off</code>.`,
  steps:[`Map UI choices to rollups with <code>product_scope.rollups_for()</code> (optionally widen along INHERITS_FROM to General).`,
         `Embed the incoming question with the same LiteLLM embedding model used at ingestion.`,
         `SEARCH the index with <code>WHERE a.family IN $families AND a.status = 'current'</code>, over-fetching so parents and duplicates do not cost a slot.`,
         `Expand each hit: Question, Questionnaire &rarr; Customer / Model, Topics, and the FOLLOWS_UP parent's answer when confidence &ge; 0.9.`,
         `Topic expansion (off by default): same-topic answers in scope, re-scored with <code>vector.similarity.cosine()</code> and merged by score.`,
         `Return in the pgvector result shape, and record the draft with its BASED_ON evidence (capability 8).`],
  example:`Asked &ldquo;Are you planning to implement a DLP tool in the next 12 months?&rdquo; for GeneXpert - GX, the graph returns Excel 678 (score 1.000) <i>and</i> its premise Excel 676 &ldquo;Do you currently have DLP tools installed?&rdquo; &rarr; No, &ldquo;Device is in customer network&rdquo;. The LLM answered &ldquo;No. Device is in customer network.&rdquo;`,
  cypher:`CYPHER 25
// 1) vector search, product scope filtered INSIDE the index
MATCH (a:Answer)
  SEARCH a IN (
    VECTOR INDEX answer_embedding
    FOR $qvec
    WHERE a.family IN $families AND a.status = 'current'
    LIMIT $k
  ) SCORE AS score
// 2) graph context for every hit
MATCH (q:Question)-[:HAS_ANSWER]->(a),
      (q)-[:PART_OF]->(qn:Questionnaire)-[:FOR_MODEL]->(m:ProductModel)
OPTIONAL MATCH (qn)-[:FROM_CUSTOMER]->(c:Customer)
OPTIONAL MATCH (q)-[:FOLLOWS_UP]->(p:Question)
OPTIONAL MATCH (p)-[:HAS_ANSWER]->(pa:Answer {status: 'current'})
RETURN a.id AS id, round(score, 3) AS score, q.text AS question, q.subject AS subject,
       a.verdict AS verdict, a.response AS response, a.comment AS comment,
       a.stance AS stance, m.name AS model, c.name AS customer,
       p.text AS parentQuestion, pa.response AS parentAnswer,
       COLLECT { MATCH (q)-[:ABOUT]->(t:Topic) RETURN t.code } AS topics
ORDER BY score DESC

// 3) topic expansion: same topic and scope, re-ranked against the question
MATCH (hit:Answer)<-[:HAS_ANSWER]-(:Question)-[:ABOUT]->(t:Topic)
WHERE hit.id IN $hitIds
MATCH (t)<-[:ABOUT]-(:Question)-[:HAS_ANSWER]->(sib:Answer)
WHERE sib.family IN $families AND sib.status = 'current' AND NOT sib.id IN $hitIds
WITH DISTINCT sib, vector.similarity.cosine(sib.embedding, $qvec) AS sim
WHERE sim >= $minSim
RETURN sib.id AS id, round(sim, 3) AS sim
ORDER BY sim DESC LIMIT $extra`},

 q2: {title:'Capability 2 · Follow-up context',
  nodes:['question','answer','questionnaire'],
  edges:['follows_up','has_answer','part_of_q'],
  desc:`55 questions only make sense with the one before them (&ldquo;If yes, which DLP tools&hellip;&rdquo;, &ldquo;When is it backed up?&rdquo;). In a flat vector store they are noise. The graph links each to its parent, so retrieval returns the pair, and the follow-up's embedding text carries the parent question. <b>Shipped.</b>`,
  steps:[`At ingestion: detect follow-ups (&ldquo;If yes / If no / If so&rdquo; at 0.9, short pronoun-only questions at 0.6) and link each to the nearest earlier non-follow-up in the same questionnaire.`,
         `Prefix the parent question in the follow-up's Answer.text before embedding, for links of confidence &ge; 0.9 only.`,
         `At retrieval: when a hit is a follow-up, also return its parent's answer, scored against the same question vector.`],
  example:`Excel 677 &ldquo;If yes, which DLP tools are you using?&rdquo; (unanswered) &rarr; parent Excel 676 &ldquo;Do you currently have DLP tools installed?&rdquo; No, &ldquo;Device is in customer network&rdquo;; sibling Excel 678 &ldquo;If no, are you planning on implementing a DLP tool in the next 12 months?&rdquo; No.`,
  cypher:`// a follow-up travels with its parent (and the parent with its follow-ups)
MATCH (q:Question {id: $questionId})
OPTIONAL MATCH (q)-[f:FOLLOWS_UP]->(parent:Question)
OPTIONAL MATCH (parent)-[:HAS_ANSWER]->(pa:Answer {status: 'current'})
RETURN q.text AS question, f.signal AS signal,
       parent.text AS parentQuestion, pa.verdict AS parentVerdict,
       pa.comment AS parentComment,
       COLLECT {
         MATCH (child:Question)-[:FOLLOWS_UP]->(q)
         OPTIONAL MATCH (child)-[:HAS_ANSWER]->(ca:Answer {status: 'current'})
         RETURN {question: child.text, verdict: ca.verdict, comment: ca.comment}
       } AS followUps

// ingestion side: the text that gets embedded for a follow-up
MATCH (child:Question)-[:FOLLOWS_UP]->(parent:Question),
      (child)-[:HAS_ANSWER]->(a:Answer)
RETURN a.id, 'Question (follow-up to: ' + parent.text + '): ' + child.text AS embeddedQuestion`},

 q3: {title:'Capability 3 · Answer consistency',
  nodes:['topic','question','answer','questionnaire','customer'],
  edges:['about_q','has_answer','part_of_q','from_customer_qn'],
  desc:`Customers ask the same thing in different words, and the datasheet sometimes answers differently. Grouping Yes/No answers by topic and subject surfaces contradictions as a review worklist. Organisation-level answers must agree across <i>all</i> families; product-level ones only within a family. A graph query cannot read prose, so the output goes to an SME (or an LLM QC pass) to reconcile.`,
  steps:[`Group current Yes/No answers by topic and question subject; product-level groups also split by family.`,
         `Keep groups that contain both Yes and No.`,
         `Show the wording, customer and Excel row of each side.`,
         `The SME supersedes the wrong answer (capability 7).`],
  example:`MFA, organisation level, GeneXpert - GX: Excel 715 &ldquo;Is Multi-Factor Authentication used?&rdquo; Yes and 741 &ldquo;Do you require multi-factor authentication?&rdquo; Yes, vs 1832 &ldquo;Are employees / contractors with elevated permissions required to use MFA&hellip;?&rdquo; No.<br>SOC 2: Excel 103 &ldquo;Has a SOC 2 Type II&hellip; audit been conducted&hellip;?&rdquo; Yes, vs 1547 &ldquo;SOC 2 Type 1&rdquo; No and 1042 &ldquo;We do not have SOC2&hellip;&rdquo;.`,
  cypher:`MATCH (t:Topic)<-[:ABOUT]-(q:Question)-[:HAS_ANSWER]->(a:Answer {status: 'current'})
WHERE a.verdict IN ['yes', 'no']
WITH t, q.subject AS subject,
     CASE q.subject WHEN 'organization' THEN 'all families' ELSE a.family END AS scope,
     collect(DISTINCT a.verdict) AS verdicts,
     collect({excelRow: q.rowIndex + 2, verdict: a.verdict, question: q.text}) AS evidence
WHERE size(verdicts) > 1
RETURN t.name AS topic, subject, scope, evidence

 q5: {title:'Capability 5 · Coverage gaps',
  nodes:['topic','question','answer','family','draft'],
  edges:['about_q','has_answer','based_on'],
  desc:`Three kinds of gap: topics a family has never answered (Graph RAG will have to widen scope or say &ldquo;insufficient information&rdquo;), questions that were asked but never answered, and &mdash; now that answers are written back &mdash; the questions real customers asked that nothing in the datasheet supported. Use it to plan which answers the SMEs write next.`,
  steps:[`Cross every Topic with every ProductFamily.`,
         `Keep the pairs with no current Answer in that family.`,
         `Separately, count questions per topic that have no Answer at all.`,
         `Third: drafts with no BASED_ON edge, or a <code>topScore</code> too low to trust.`],
  example:`After the LLM topic pass every family spans 28-35 of the 35 topics, so a gap is now a real evidence gap rather than an untagged question. 204 datasheet questions still have no answer at all.`,
  cypher:`// topics a product family has never answered
MATCH (t:Topic), (f:ProductFamily)
WHERE NOT EXISTS {
  MATCH (t)<-[:ABOUT]-(:Question)-[:HAS_ANSWER]->(a:Answer)
  WHERE a.family = f.name AND a.status = 'current'
}
RETURN f.uiLabel AS product, collect(t.name) AS topicsWithoutAnswers
ORDER BY product

// asked, never answered
MATCH (q:Question)-[:ABOUT]->(t:Topic)
WHERE NOT EXISTS { (q)-[:HAS_ANSWER]->(:Answer) }
RETURN t.name AS topic, count(q) AS unanswered
ORDER BY unanswered DESC

// what customers asked that we could not support
MATCH (d:DraftAnswer)
WHERE d.evidenceCount = 0 OR d.topScore < 0.5
RETURN d.question, d.answer, d.topScore, d.submissionId
ORDER BY coalesce(d.topScore, 0.0)`},

 q7: {title:'Capability 7 · Change impact',
  nodes:['answer','question','topic','draft','submission'],
  edges:['supersedes','has_answer','about_q','based_on','part_of_d'],
  desc:`When a policy or product changes (say Infinity gains MFA), an SME records a new Answer that SUPERSEDES the old one. The old answer leaves the vector-index filter immediately. One traversal then gives the review worklist: same-topic answers in the same family that may now be stale, and every submission whose drafts relied on the outdated answer.`,
  steps:[`Create the new Answer on the same Question, link SUPERSEDES, set the old status to superseded, then embed the new text.`,
         `From the old answer, follow ABOUT to its topics and back to same-family answers.`,
         `Follow incoming BASED_ON to drafts, and PART_OF to their submissions.`],
  example:`A new answer SUPERSEDES Excel 239 &ldquo;Does the system support / require MFA for access?&rdquo; (Infinity, No) &rarr; review the other Infinity MFA answers, and every submission whose drafts cited row 239.`,
  cypher:`// an SME records the corrected answer; the old one stops being retrievable
MATCH (q:Question)-[:HAS_ANSWER]->(old:Answer {id: $oldId})
CREATE (new:Answer {id: $newId, verdict: $verdict, response: $response,
                    comment: $comment, family: old.family,
                    status: 'current', origin: 'sme'})
CREATE (q)-[:HAS_ANSWER]->(new)
CREATE (new)-[:SUPERSEDES {reason: $reason, date: date(), by: $user}]->(old)
SET old.status = 'superseded'

// review worklist
MATCH (new:Answer {id: $newId})-[:SUPERSEDES]->(old:Answer)
      <-[:HAS_ANSWER]-(:Question)-[:ABOUT]->(t:Topic)
OPTIONAL MATCH (t)<-[:ABOUT]-(:Question)-[:HAS_ANSWER]->(peer:Answer {status: 'current'})
  WHERE peer.family = old.family AND peer <> new
OPTIONAL MATCH (d:DraftAnswer)-[:BASED_ON]->(old)
RETURN old.id AS outdated, collect(DISTINCT t.name) AS topics,
       collect(DISTINCT peer.id) AS sameTopicAnswersToReview,
       collect(DISTINCT d.submissionId) AS submissionsThatUsedIt`},

 q8: {title:'Capability 8 · Write-back & audit',
  nodes:['submission','draft','answer','question','topic','family'],
  edges:['part_of_d','based_on','has_answer','about_d','scoped_to'],
  desc:`<b>Shipped.</b> Graph RAG writes each generated answer back as a DraftAnswer, with one BASED_ON edge per historical answer it used. That answers &ldquo;why did we say this?&rdquo; for any submission, shows which datasheet answers do the most work, and surfaces answers built on thin evidence. In code: <code>Neo4jGraphStore.write_draft()</code>, <code>submission_audit()</code>, <code>evidence_reuse()</code>, <code>weakly_supported_drafts()</code>, <code>delete_submission()</code>.`,
  steps:[`<code>question_answering_func()</code> opens a Submission for the batch and closes it at the end.`,
         `Each answered question MERGEs a DraftAnswer and UNWINDs its evidence into BASED_ON edges (rank, score, method, inPrompt).`,
         `<code>topScore</code> is stored on the draft, so answers built on weak evidence are a query, not a hunch.`,
         `Questions that retrieved nothing are still recorded, with no BASED_ON: the coverage gaps.`,
         `Deleting a submission removes its drafts only; reference evidence is never touched.`],
  example:`Replaces the Citations column text (&ldquo;SOURCE 1: Security QA Database - GeneXpert - GX&rdquo;) with links you can query: draft &rarr; A-0676 (rank 1, score 0.729, vector) &rarr; Ridgeview, Excel 678, and rank 2 is its FOLLOWS_UP parent A-0674 at 0.615, flagged <code>method = 'follow-up-parent'</code>.`,
  cypher:`// written by Graph RAG for each uploaded question
MATCH (s:Submission {submissionId: $sid})
MERGE (d:DraftAnswer {id: $sid + ':' + toString($position)})
ON CREATE SET d.createdAt = datetime()
SET d.submissionId = $sid, d.question = $question, d.answer = $answer,
    d.status = 'draft', d.model = $model, d.evidenceCount = size($evidence),
    d.topScore = reduce(best = 0.0, ev IN $evidence |
                        CASE WHEN ev.score > best THEN ev.score ELSE best END)
MERGE (d)-[p:PART_OF]->(s)
SET p.position = $position

// one BASED_ON per row the model was shown
MATCH (d:DraftAnswer {id: $draftId})
UNWIND $evidence AS ev
MATCH (a:Answer {id: ev.id})
MERGE (d)-[b:BASED_ON]->(a)
SET b.rank = ev.rank, b.score = ev.score, b.method = ev.method,
    b.inPrompt = ev.inPrompt, b.query = $question, b.linkedAt = datetime()

// audit: why did we answer this way?
MATCH (s:Submission {submissionId: $sid})<-[p:PART_OF]-(d:DraftAnswer)
OPTIONAL MATCH (d)-[b:BASED_ON]->(a:Answer)<-[:HAS_ANSWER]-(q:Question)
WITH p, d, b, a, q ORDER BY b.rank
RETURN p.position AS n, d.question AS asked, d.answer AS generated, d.topScore AS topScore,
       collect({rank: b.rank, score: b.score, method: b.method,
                excelRow: q.rowIndex + 2, usedAnswer: a.response}) AS evidence
ORDER BY n

// hallucination risk: confident answers built on thin evidence
MATCH (d:DraftAnswer)
WHERE d.topScore IS NULL OR d.topScore < 0.5
RETURN d.submissionId, d.question, d.answer, d.topScore, d.evidenceCount
ORDER BY coalesce(d.topScore, 0.0)

// reuse: which datasheet answers do the most work
MATCH (d:DraftAnswer)-[:BASED_ON {inPrompt: true}]->(a:Answer)<-[:HAS_ANSWER]-(q:Question)
RETURN a.id AS answer, a.family AS product, q.rowIndex + 2 AS excelRow,
       count(DISTINCT d.submissionId) AS submissions
ORDER BY submissions DESC LIMIT 20`}
};

const R = 50;
const nodeById = {};

const el = (t, attrs, parent) => {
  const e = document.createElementNS(NS, t);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);

};

const defs = el('defs', {}, svg);
const COLORS = {'#555555':'m0', '#C0392B':'m1', '#1E8449':'m2', '#7D3C98':'m3'};
for (const c in COLORS) {

  el('path', {d:'M 0 0 L 10 5 L 0 10 z', fill:c}, m);
}

const bgLayer = el('g', {class:'layerbox'}, svg);
el('rect', {x:10, y:10, width:1085, height:960, rx:16, fill:'#f2f8fd', stroke:'#bcd8ee', 'stroke-dasharray':'6 4'}, bgLayer);

const edgeLayer = el('g', {}, svg);
const nodeLayer = el('g', {}, svg);
const edgeEls = {}, nodeEls = {};

function edgeGeom(e) {
  const a = nodeById[e.from], b = nodeById[e.to];
  if (e.from === e.to) {
    const ang = (e.self || 0) * Math.PI / 180, o = 62;
    const p1x = a.x + Math.cos(ang - .5) * R, p1y = a.y + Math.sin(ang - .5) * R;
    const p2x = a.x + Math.cos(ang + .5) * R, p2y = a.y + Math.sin(ang + .5) * R;
    const c1x = a.x + Math.cos(ang - .6) * (R + o), c1y = a.y + Math.sin(ang - .6) * (R + o);
    const c2x = a.x + Math.cos(ang + .6) * (R + o), c2y = a.y + Math.sin(ang + .6) * (R + o);
    return { d:`M ${p1x} ${p1y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2x} ${p2y}`,
             lx: a.x + Math.cos(ang) * (R + o + 8), ly: a.y + Math.sin(ang) * (R + o + 8) };
  }
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  const nx = -dy / len, ny = dx / len, c = e.curve || 0;
  const mx = (a.x + b.x) / 2 + nx * c, my = (a.y + b.y) / 2 + ny * c;
  const t1 = R / len;
  const sx = a.x + dx * t1 + nx * c * t1 * 2, sy = a.y + dy * t1 + ny * c * t1 * 2;
  const ex = b.x - dx * t1 + nx * c * t1 * 2, ey = b.y - dy * t1 + ny * c * t1 * 2;
  return { d:`M ${sx} ${sy} Q ${mx} ${my} ${ex} ${ey}`, lx: mx * 0.5 + (sx + ex) * 0.25, ly: my * 0.5 + (sy + ey) * 0.25 };
}

EDGES.forEach(e => {
  const cls = ['edge', e.phase, e.bridge ? 'bridge' : ''].join(' ').trim();
  const g = el('g', {class:cls, 'data-id':e.id}, edgeLayer);
  const col = e.color || '#555555';
  const path = el('path', {stroke:col, 'marker-end':`url(#${COLORS[col]})`}, g);
  const bg = el('rect', {class:'lblbg', rx:3}, g);
  const lbl = el('text', {class:'lbl', 'text-anchor':'middle'}, g);
  lbl.textContent = e.type;
  g.addEventListener('click', ev => { ev.stopPropagation(); select('edge', e.id); });
  edgeEls[e.id] = {g, path, lbl, bg};
});

NODES.forEach(n => {
  const g = el('g', {class:`node ${n.layer} ${n.phase}`, 'data-id':n.id}, nodeLayer);
  el('circle', {r:R}, g);
  const t = el('text', {'text-anchor':'middle', y:-1, class: n.cap.length > 11 ? 'long' : ''}, g);
  t.textContent = n.cap;
  const c = el('text', {'text-anchor':'middle', y:15, class:'cnt'}, g);
  c.textContent = n.count;
  g.addEventListener('mousedown', ev => startDrag(ev, n));
  g.addEventListener('click', ev => { ev.stopPropagation(); if (!dragMoved) select('node', n.id); });
  nodeEls[n.id] = g;
});

function updatePositions() {
  NODES.forEach(n => nodeEls[n.id].setAttribute('transform', `translate(${n.x},${n.y})`));
  EDGES.forEach(e => {
    const geo = edgeGeom(e), ee = edgeEls[e.id];
    ee.path.setAttribute('d', geo.d);
    ee.lbl.setAttribute('x', geo.lx);
    ee.lbl.setAttribute('y', geo.ly + 3);
    const bb = ee.lbl.getBBox();
    ee.bg.setAttribute('x', bb.x - 3); ee.bg.setAttribute('y', bb.y - 1);
    ee.bg.setAttribute('width', bb.width + 6); ee.bg.setAttribute('height', bb.height + 2);
  });
}

const edgeVisible = e => nodeVisible(nodeById[e.from]) && nodeVisible(nodeById[e.to]) && (e.phase !== 'v2' || show.v2);
function applyVisibility() {
  NODES.forEach(n => { nodeEls[n.id].style.display = nodeVisible(n) ? '' : 'none'; });
  EDGES.forEach(e => { edgeEls[e.id].g.style.display = edgeVisible(e) ? '' : 'none'; });

}

let drag = null, dragMoved = false, pan = null;
let vb = {x:0, y:0, w:1500, h:980};
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
const toSvg = ev => {
  const r = svg.getBoundingClientRect();
  return { x: vb.x + (ev.clientX - r.left) / r.width * vb.w, y: vb.y + (ev.clientY - r.top) / r.height * vb.h };
};
function startDrag(ev, n) { ev.stopPropagation(); const p = toSvg(ev); drag = {n, ox: n.x - p.x, oy: n.y - p.y}; dragMoved = false; }
svg.addEventListener('mousedown', ev => { pan = {sx: ev.clientX, sy: ev.clientY, vx: vb.x, vy: vb.y}; svg.classList.add('panning'); });
window.addEventListener('mousemove', ev => {
  if (drag) {
    const p = toSvg(ev);
    drag.n.x = p.x + drag.ox; drag.n.y = p.y + drag.oy; dragMoved = true; updatePositions();
  } else if (pan) {
    const r = svg.getBoundingClientRect();
    vb.x = pan.vx - (ev.clientX - pan.sx) / r.width * vb.w;
    vb.y = pan.vy - (ev.clientY - pan.sy) / r.height * vb.h;
    setVB();
  }
});
window.addEventListener('mouseup', () => { drag = null; pan = null; svg.classList.remove('panning'); });
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const p = toSvg(ev), f = ev.deltaY > 0 ? 1.12 : 1 / 1.12;
  vb = { x: p.x - (p.x - vb.x) * f, y: p.y - (p.y - vb.y) * f, w: vb.w * f, h: vb.h * f };
  setVB();
}, {passive:false});

function showDDL() {
  panel.innerHTML = `<h2>Database &amp; indexes</h2>
  <p><code>scripts/ingest_graph.py</code> runs all of this; the statements are here so you can read or re-run them in Neo4j Browser. A separate <code>trustform</code> database keeps this graph away from <code>neo4j</code>, <code>gvd</code> and <code>sec</code> on the same instance, and the script refuses to write to a database whose name does not start with <code>trustform</code>. The instance defaults to Cypher 5, so statements that use the vector-index filter syntax or <code>SEARCH</code> start with <code>CYPHER 25</code>.</p>
  <pre>${highlight(document.getElementById('ddl-text').textContent)}</pre>
  <p class="hint">Hybrid retrieval: rank the SEARCH vector results and the full-text results separately and fuse them with reciprocal rank fusion in Python, as the pgvector backend does today. Dense alone currently scores higher on this corpus in both backends.</p>`;
}

function showNode(id) {
  const n = nodeById[id];
  const edges = EDGES.filter(e => e.from === id || e.to === id);
  panel.innerHTML = `<h2>${n.cap}</h2>
  ${LAYER_TAG[n.layer]}${PHASE_TAG[n.phase]}
  <p>${n.desc}</p>
  ${n.data ? `<h3>In the March 2025 datasheet</h3>${list(n.data)}` : ''}
  ${n.index ? `<h3>Indexes</h3><p>${n.index}</p>` : ''}
  <h3>Properties</h3>${propTable(n.props)}
  ${n.topics ? `<h3>Taxonomy (&asymp; questions from the keyword pass)</h3><table><tr><th>code</th><th>topic</th><th>MDS2</th><th class="n">&asymp;Qs</th></tr>${
    TOPICS.map((t, i) => (i === 0 || TOPICS[i - 1][0] !== t[0] ? `<tr><td colspan="4" style="font-weight:600;color:#566573;padding-top:8px">${t[0]}</td></tr>` : '') +
      `<tr><td class="k">${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td class="n">${t[4]}</td></tr>`).join('')}</table>` : ''}
  <h3>Edges</h3>
  <table>${edges.map(e => {
    const out = e.from === id;
    const other = nodeById[out ? e.to : e.from].cap;
    return `<tr><td class="k">${e.from === e.to ? '&#8635; ' : out ? '&rarr; ' : '&larr; '}${e.type}</td><td>${other}</td><td>${PHASE_TAG[e.phase]}</td></tr>`;
  }).join('')}</table>`;
}

function showEdge(id) {
  const e = EDGES.find(x => x.id === id);
  panel.innerHTML = `<h2>${e.type}</h2>
  ${PHASE_TAG[e.phase]}
  <p><b>${nodeById[e.from].cap}</b> &rarr; <b>${nodeById[e.to].cap}</b></p>
  <h3>Cardinality</h3><p>${e.card}</p>
  ${e.props.length ? `<h3>Properties</h3><table>${e.props.map(p => `<tr><td class="k">${esc(p[0])}</td><td>${esc(p[1])}</td></tr>`).join('')}</table>` : ''}
  <h3>Purpose</h3><p>${e.why}</p>
  ${e.data ? `<h3>In the datasheet</h3><p>${e.data}</p>` : ''}`;
}

function showQuery(q) {
  const Q = QUERIES[q];
  panel.innerHTML = `<h2>${Q.title}</h2>
  <p>${Q.desc}</p>
  <h3>Traversal</h3><ol>${Q.steps.map(s => `<li>${s}</li>`).join('')}</ol>
  <h3>Example from the datasheet</h3><div class="example">${Q.example}</div>
  <h3>Cypher</h3><pre>${highlight(Q.cypher)}</pre>`;
}

function showCurrent() {
  if (QUERIES[curView]) showQuery(curView);
  else if (curView === 'mapping') showMapping();
  else if (curView === 'ddl') showDDL();
  else showOverview();
}

function applyHighlight() {
  const Q = QUERIES[curView];
  NODES.forEach(n => nodeEls[n.id].classList.toggle('dimmed', !!Q && !Q.nodes.includes(n.id)));
  EDGES.forEach(e => {
    const on = !Q || Q.edges.includes(e.id);
    edgeEls[e.id].g.classList.toggle('dimmed', !on);
    edgeEls[e.id].g.classList.toggle('glow', !!Q && on);
  });
}

function select(kind, id) {
  document.querySelectorAll('.node.selected,.edge.selected').forEach(x => x.classList.remove('selected'));
  if (kind === 'node') { nodeEls[id].classList.add('selected'); showNode(id); }
  else if (kind === 'edge') { edgeEls[id].g.classList.add('selected'); showEdge(id); }
  else showCurrent();
}

document.querySelectorAll('.qbtn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.qbtn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  curView = b.dataset.q;
  applyHighlight();
  select(null);
}));

updatePositions(); setVB(); showOverview();
</script>
</body>
</html>
