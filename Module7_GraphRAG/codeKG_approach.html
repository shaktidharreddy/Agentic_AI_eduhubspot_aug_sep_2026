      libraryPanel({ columns: 3, intro: "Insight questions compute exact numbers over the whole knowledge graph; code deep dives search and traverse the code itself. Copy one and paste it into the Cursor chat." }));
    dlg.addEventListener("close", () => dlg.remove());
    dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
    document.body.append(dlg);
    dlg.showModal();
  }
  /* the insight a turn computed (graphrag_context in the insight route): the same metric cards and rows the app shows above its chart */
  function insightBlock(turn) {
    const step = turn.steps.find((s) => s.view && s.view.insight);
    return step ? insightCard(step.view.insight, { limit: 8, asOf: step.view.status_as_of }) : null;
  }
  function swoosh() {
    return h("div", { class: "swoosh", "aria-hidden": "true", html:
      '<svg viewBox="0 0 360 220" preserveAspectRatio="xMaxYMid slice"><path d="M0 150C95 60 215 18 355 6 245 46 118 92 42 178Z" fill="#007AC2" opacity=".10"/>' +
      '<path d="M26 182C108 108 205 66 335 48 238 84 135 126 72 202Z" fill="#007AC2" opacity=".16"/>' +
      '<path d="M62 208C124 154 198 118 300 96 220 126 142 160 104 220Z" fill="#007AC2" opacity=".26"/></svg>' });
  }
  function constellation(sg, w = 176, ht = 84) {
    const nodes = sg.nodes.slice(0, 90);
    const idx = new Map(nodes.map((n, i) => [n.key, i]));
    const pos = nodes.map((n, i) => {
      if (n.key === "question") return [w * 0.12, ht / 2];
      const a = i * 2.399963, r = 0.2 + 0.8 * Math.sqrt(i / nodes.length);
      return [w * 0.56 + Math.cos(a) * r * w * 0.42, ht / 2 + Math.sin(a) * r * ht * 0.44];
    });
    const lines = sg.edges.filter((e) => idx.has(e.source) && idx.has(e.target)).map((e) => {
      const a = pos[idx.get(e.source)], b = pos[idx.get(e.target)];
      return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;
    }).join("");
    const dots = nodes.map((n, i) => `<circle cx="${pos[i][0].toFixed(1)}" cy="${pos[i][1].toFixed(1)}" r="${n.key === "question" ? 5 : n.hit || n.target ? 3.4 : 2}" fill="${NODE_COLORS[n.label] || "#8A97A6"}"/>`).join("");
    return h("span", { class: "constellation", "aria-hidden": "true", html: `<svg viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}"><g stroke="#99CAE9" stroke-width=".7" opacity=".8">${lines}</g>${dots}</svg>` });
  }
  function followUps(turn) {
    const repos = {};
    for (const n of turn.trace.subgraph.nodes) if (n.repo) repos[n.repo] = (repos[n.repo] || 0) + 1;
    for (const c of turn.citations || []) if (c.repo) repos[c.repo] = (repos[c.repo] || 0) + 2;
    const repo = Object.keys(repos).sort((a, b) => repos[b] - repos[a])[0];
    if (!repo) return [];
    const q = {
      impact: [`Who owns ${repo}?`, `What is deployed to prod for ${repo}, and is anything waiting to be deployed?`, `Which API endpoints does ${repo} serve and who calls them?`],
      api: [`Is CI passing for ${repo}?`, `Who owns ${repo}?`, `What does ${repo} do and which LLM models does it use?`],
      status: [`Who owns ${repo}?`, `What is deployed to prod for ${repo}?`, `Show the latest workflow runs for ${repo}`],
      people: [`Is CI passing for ${repo}?`, `What does ${repo} do?`, `Which API endpoints does ${repo} serve?`],
      lineage: [`Who owns ${repo}?`, `Which functions in ${repo} read or write tables?`],
    }[turn.route] || [`Who owns ${repo}?`, `Is CI passing for ${repo}?`, `Which API endpoints does ${repo} serve?`];
    return q.slice(0, 3);
  }
  function conversationMarkdown() {
    const s = S.data.session;
    return [`# ${s.title}`, ...turnsOf().flatMap((t) => [`\n## ${t.question}\n`, t.answer, "\nSources:", ...(t.citations || []).map((c) => `${c.n}. ${c.name || c.path || c.url} \u2014 ${c.url}`)])].join("\n");
  }

  /* ---------------------------------------------------------------- sidebar */
  function renderSide() {
    const ov = S.data.overview;
    const s = S.data.session;
    const el = [];
    el.push(h("a", { class: "brand", href: boot.indexHref || "#", title: "Code graph assistant home" },
      h("img", { src: LOGO, alt: "Cepheid. A better way.", width: 150 })));
    el.push(h("div", { class: "side-sec" },
      h("h3", null, "Knowledge graph"),
      ov ? h("div", { class: "stats" }, statCard(num(ov.repositories), "Repositories"), statCard(num((ov.node_counts || {}).Function), "Functions")) : h("div", { class: "note" }, "Run the skill's doctor command to load graph facts."),
      ov ? h("ul", { class: "facts" },
        h("li", null, icon("clock", 14), h("span", null, "Code indexed ", h("b", null, when(ov.code_indexed_at)))),
        h("li", null, icon("refresh", 14), h("span", null, "CI and deployments synced ", h("b", null, when(ov.ci_synced_at)))),
        h("li", null, icon("cpu", 14), h("span", null, "Answers written by the ", h("b", null, "Cursor agent"), " from the codekg MCP server"))) : null));
    el.push(h("div", { class: "side-sec side-actions" },
      h("button", { type: "button", class: "btn btn-primary btn-block", title: "Copies a prompt for the Cursor chat: type your question after it",
        onclick: () => copyText(`${SKILL_CMD} new conversation: `, "Copied. Paste it into the Cursor chat and add your question.") }, icon("plus", 15), "New conversation"),
      (S.data.library && S.data.library.questions.length) ? h("button", { type: "button", class: "btn btn-block", title: "Curated questions: insights over the whole graph and code deep dives",
        onclick: openLibrary }, icon("lightbulb", 15), "Question library") : null));
    const turns = turnsOf();
    if (s && turns.length) {
      el.push(h("div", { class: "side-sec" }, h("h3", null, "This conversation"),
        h("ol", { class: "convo" }, ...turns.map((t) => h("li", null, h("button", { type: "button", class: "convo-item" + (S.traceTurn === t.id ? " on" : ""), onclick: () => scrollToTurn(t.id) },
          h("span", { class: "convo-route" }, icon((ROUTES[t.route] || ROUTES.lookup).icon, 13)), h("span", { class: "convo-q" }, clip(t.question, 70)),
          h("span", { class: "convo-m" }, `${(ROUTES[t.route] || ROUTES.lookup).label} \u00b7 ${plural(t.steps.length, "tool call")}`)))))));
    }
    const others = (S.data.sessions || []).filter((x) => !s || x.id !== s.id).slice(0, 6);
    if (others.length && boot.mode !== "export") {
      el.push(h("div", { class: "side-sec" }, h("h3", null, boot.mode === "home" ? "Recent conversations" : "Earlier conversations"),
        h("ul", { class: "past" }, ...others.map((x) => h("li", null, h("a", { href: x.href, title: x.title },
          h("span", { class: "past-q" }, clip(x.title, 56)), h("span", { class: "past-m" }, `${plural(x.turns, "answer")} \u00b7 ${ago(x.updated)}`)))))));
    }
    el.push(h("details", { class: "side-sec how" }, h("summary", null, icon("info", 14), "How answers are built"),
      h("ol", null, ...HOW_STEPS.map((x) => h("li", null, h("b", null, x.title + ": "), x.text)))));
    el.push(h("div", { class: "side-foot" }, "Headless GraphRAG for Cursor", h("br"), "codekg MCP \u00b7 read-only"));
    side.replaceChildren(...el);
  }

  /* ---------------------------------------------------------------- home */
  function renderHome() {
    const ov = S.data.overview;
    const hero = h("section", { class: "hero" },
      swoosh(),
      h("div", { class: "hero-body" },
        h("img", { class: "hero-logo", src: LOGO, alt: "Cepheid. A better way.", width: 190 }),
        h("h1", null, "Code graph assistant"),
        h("p", { class: "hero-sub" }, "GraphRAG over the Cepheid-Data-Platform GitHub organization, with sources for every answer."),
        h("p", { class: "hero-text" }, WELCOME),
        h("div", { class: "hero-cta" }, h("span", { class: "kbd-hint" }, icon("terminal", 15), "Ask in the Cursor chat, for example"), h("code", null, `${SKILL_CMD} What breaks if I change get_db?`),
          h("button", { type: "button", class: "btn btn-sm", onclick: () => copyQuestion("What breaks if I change get_db in cdp-genai-pgvector-inference?") }, icon("copy", 13), "Copy"))));
    const out = [hero];
    out.push(h("section", { class: "block" }, h("h2", null, icon("lightbulb", 18), "Not sure where to start?"),
      h("p", { class: "muted" }, "Pick a question from the library: insight questions compute exact numbers over the whole graph, and every answer has \u201CHow this answer was built\u201D. Copy one and paste it into the Cursor chat."),
      libraryPanel({ columns: 2, intro: "" })));
    if (ov) {
      const nc = ov.node_counts || {};
      const areas = Object.entries(ov.apps_by_area || {}).sort((a, b) => b[1] - a[1]);
      const maxA = Math.max(1, ...areas.map((a) => a[1]));
      out.push(h("section", { class: "block" }, h("h2", null, icon("db", 18), "What the graph knows"),
        h("div", { class: "kpis" }, ...[["Repositories", ov.repositories], ["Apps", nc.App], ["Functions", nc.Function], ["API endpoints", nc.ApiEndpoint], ["Tables", nc.Table], ["LLM models", nc.LLMModel]]
          .map(([l, v]) => h("div", { class: "kpi" }, h("div", { class: "kpi-v" }, num(v)), h("div", { class: "kpi-l" }, l)))),
        h("div", { class: "areas" }, h("div", { class: "cap" }, "Apps by business area"),
          ...areas.map(([a, n]) => h("div", { class: "area" }, h("span", { class: "area-n" }, a), h("span", { class: "area-bar" }, h("i", { style: { width: (100 * n / maxA) + "%" } })), h("span", { class: "area-c" }, String(n)))))));
    }
    out.push(h("section", { class: "block" }, h("h2", null, icon("route", 18), "How answers are built"),
      h("ol", { class: "flow" }, ...HOW_STEPS.map((x, i) => h("li", null, h("span", { class: "flow-n" }, String(i + 1)), h("span", { class: "flow-ic" }, icon(x.icon, 20)), h("b", null, x.title), h("p", null, x.text)))),
      h("p", { class: "muted flow-note" }, icon("insights", 14), HOW_INSIGHTS)));
    return h("div", { class: "home" }, ...out);
  }

  /* ---------------------------------------------------------------- one question + answer */
  function thought(turn) {
    const items = timelineOf(turn);
    return h("details", { class: "thought" },
      h("summary", null, icon("chevronRight", 14, "chev"), h("span", null, `Thought for ${turn.seconds} s \u00b7 ${plural(turn.steps.length, "tool call")}`)),
      h("ol", { class: "timeline" }, ...items.map((it) => h("li", { class: it.state },
        h("span", { class: "tl-ic" }, icon(it.state === "error" ? "alert" : it.ic, 14)),
        h("div", null, h("div", { class: "tl-label" }, it.label), h("div", { class: "tl-cap", html: mdInline(it.caption) }))))));
  }
  function sourcesBlock(turn) {
    const cites = turn.citations || [];
    if (!cites.length) return null;
    const limit = 5;
    const list = h("ol", { class: "srclist" }, ...cites.slice(0, limit).map((c) => citationItem(c, turn.id)));
    const box = h("section", { class: "sources" }, h("div", { class: "sources-head" }, icon("book", 16), "Sources", h("em", null, `\u00b7 ${cites.length}`)), list);
    if (cites.length > limit) {
      const more = h("button", { type: "button", class: "link-btn", onclick: () => {
        list.append(...cites.slice(limit).map((c) => citationItem(c, turn.id)));
        more.remove();
      } }, `Show ${cites.length - limit} more`);
      box.append(more);
    }
    return box;
  }
  function traceStrip(turn) {
    const sg = turn.trace.subgraph, v = turn.trace.verification || {};
    const route = ROUTES[turn.route] || ROUTES.lookup;
    const open = S.traceTurn === turn.id;
    return h("button", { type: "button", class: "tracecard" + (open ? " on" : ""), onclick: () => (open ? closeTrace() : openTrace(turn.id)),
      "aria-label": "How this answer was built" },
      constellation(sg),
      h("span", { class: "tracecard-main" },
        h("span", { class: "tracecard-t" }, icon("hub", 16), "How this answer was built"),
        h("span", { class: "tracecard-flow" },
          h("span", { class: "tf" }, icon(route.icon, 13), route.label),
          icon("chevronRight", 12),
          h("span", { class: "tf" }, icon("wrench", 13), plural(turn.steps.length, "tool call")),
          icon("chevronRight", 12),
          h("span", { class: "tf" }, icon("hub", 13), `${num(sg.nodes.length)} nodes \u00b7 ${num(sg.edges.length)} links`),
          icon("chevronRight", 12),
          v.verified_links
            ? h("span", { class: "tf ok" }, icon("shield", 13), `${plural(v.verified_links, "link")} verified`)
            : h("span", { class: "tf" }, icon("shield", 13), "no links to verify")),
        h("span", { class: "tracecard-cta" }, open ? "Showing the trace on the right" : "Explore the 3D trace", icon(open ? "eye" : "chevronRight", 14))));
  }
  function renderTurn(turn) {
    const answerEl = h("div", { class: "answer prose", html: md(turn.answer_marked || turn.answer) });
    $$("a.cite", answerEl).forEach((a) => { a.href = `#src-${turn.id}-${a.dataset.n}`; a.dataset.turn = turn.id; });
    return h("article", { class: "turn", id: "turn-" + turn.id },
      h("div", { class: "msg user" }, h("div", { class: "avatar user" }, icon("user", 17)), h("div", { class: "bubble" }, turn.question)),
      h("div", { class: "msg bot" }, h("div", { class: "avatar bot" }, icon("hub", 17)),
        h("div", { class: "bot-body" }, thought(turn), insightBlock(turn), answerEl, sourcesBlock(turn), traceStrip(turn),
          h("div", { class: "actions" },
            h("button", { type: "button", class: "btn btn-sm", onclick: () => copyText(turn.answer, "Answer copied as Markdown") }, icon("copy", 14), "Copy answer"),
            h("button", { type: "button", class: "btn btn-sm", onclick: () => copyText(conversationMarkdown(), "Conversation copied as Markdown") }, icon("download", 14), "Copy conversation"),
            h("span", { class: "meta" }, `${turn.model || "Cursor agent"} \u00b7 ${when(turn.finished)}`)))));
  }

  /* ---------------------------------------------------------------- main column */
  function renderMain() {
    const turns = turnsOf();
    const s = S.data.session;
    const scroller = $(".scroll", mainEl);
    const keep = scroller ? scroller.scrollTop : 0;
    const bar = h("header", { class: "topbar" },
      h("button", { type: "button", class: "icon-btn menu-btn", title: "Menu", "aria-label": "Show the side panel", onclick: () => app.classList.toggle("side-open") }, icon("menu", 18)),
      h("img", { class: "topbar-logo", src: LOGO, alt: "Cepheid", height: 26 }),
      h("div", { class: "topbar-title" }, h("div", { class: "t1" }, turns.length && s ? clip(s.title, 90) : "Code graph assistant"),
        h("div", { class: "t2" }, "GraphRAG over the Cepheid-Data-Platform GitHub organization, with sources for every answer")),
      h("div", { class: "topbar-actions" }, liveDot(),
        boot.indexHref && boot.mode !== "home" ? h("a", { class: "btn btn-sm", href: boot.indexHref, title: "Home: welcome, graph facts, past conversations" }, icon("home", 14), h("span", { class: "lbl" }, "Home")) : null,
        turns.length ? h("button", { type: "button", class: "btn btn-sm", title: "Copy this conversation as Markdown", onclick: () => copyText(conversationMarkdown(), "Conversation copied as Markdown") }, icon("copy", 14), h("span", { class: "lbl" }, "Copy conversation")) : null));
    let body;
    if (!turns.length) body = renderHome();
    else {
      const last = lastTurn();
      const ups = followUps(last);
      body = h("div", { class: "thread" }, ...turns.map(renderTurn),
        h("div", { class: "dock" },
          h("div", { class: "dock-main" }, h("span", { class: "dock-ic" }, icon("message", 17)),
            h("div", null, h("b", null, `Ask your next question in the Cursor chat, starting with ${SKILL_CMD}`), h("span", null, " \u2014 this page updates by itself with the answer, its sources and its trace."))),
          ups.length ? h("div", { class: "dock-ups" }, h("span", { class: "cap" }, "Follow-ups"),
            ...ups.map((u) => h("button", { type: "button", class: "chip action", title: u + "\n(click to copy with " + SKILL_CMD + ", then paste into the Cursor chat)", onclick: () => copyQuestion(u) }, clip(u, 46)))) : null));
    }
    const sc = h("div", { class: "scroll" }, body);
    mainEl.replaceChildren(bar, sc);
    sc.scrollTop = keep;
  }
  function scrollToTurn(id, instant) {
    const el = $("#turn-" + id);
    const sc = $(".scroll", mainEl);
    if (!el || !sc) return;
    const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 18;
    sc.scrollTo({ top: Math.max(0, top), behavior: instant ? "auto" : "smooth" });
  }

  /* ---------------------------------------------------------------- trace panel */
  function openTrace(id) {
    S.traceTurn = id;
    S.follow = lastTurn() && lastTurn().id === id;
    syncTrace();
    renderSide();
    renderMain();
  }
  function closeTrace() {
    if (S.traceInst) { S.traceInst.destroy(); S.traceInst = null; }
    S.traceTurn = null;
    S.graph = null;
    syncTrace();
    renderSide();
    renderMain();
  }
  function syncTrace() {
    const turn = turnsOf().find((t) => t.id === S.traceTurn);
    if (!turn) {
      if (S.traceInst) { S.traceInst.destroy(); S.traceInst = null; }
      traceHost.replaceChildren();
      app.classList.remove("has-trace", "focus-graph");
      return;
    }
    app.classList.add("has-trace");
    app.classList.toggle("focus-graph", S.focus === "graph");
    if (S.traceInst && S.traceInst.turnId === turn.id) return;
    if (S.traceInst) S.traceInst.destroy();
    const inst = renderTrace(turn, { ui: uiFor(turn), lib: boot.lib, snap: S.snap, graphHeight: S.focus === "graph" ? Math.max(380, innerHeight - 205) : 560,
      onClose: closeTrace, setGraph: (g) => { S.graph = g; } });
    inst.turnId = turn.id;
    S.traceInst = inst;
    traceHost.replaceChildren(inst.el);
    traceHost.scrollTop = 0;
    if (S.focus === "graph") setTimeout(() => inst.focusGraph(), 80);
  }

  /* ---------------------------------------------------------------- data updates */
  function render() {
    renderSide();
    renderMain();
    syncTrace();
  }
  function onData(next) {
    if (!next || next.rev === S.lastRev) { if (next) S.status = "live"; return; }
    const before = turnsOf();
    const prevLast = before.length ? before[before.length - 1].id : null;
    S.data = next;
    S.lastRev = next.rev;
    S.status = "live";
    const after = turnsOf();
    if (after.length > before.length) {
      const last = after[after.length - 1];
      if (S.traceTurn && S.traceTurn === prevLast) S.traceTurn = last.id;
      render();
      setTimeout(() => scrollToTurn(last.id), 80);
    } else render();
  }
  function poll() {
    if (!boot.poll || document.hidden) return;
    const s = h("script", { src: `${boot.dataSrc}?t=${Date.now()}` });
    s.onload = () => { s.remove(); onData(window.__CODEKG__); };
    s.onerror = () => { s.remove(); if (S.status !== "paused") { S.status = "paused"; const l = $(".live", mainEl); if (l) l.replaceWith(liveDot()); } };
    document.head.append(s);
  }

  /* ---------------------------------------------------------------- events */
  app.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("a.cite");
    if (!a) return;
    e.preventDefault();
    const target = document.getElementById(`src-${a.dataset.turn}-${a.dataset.n}`);
    if (target) { target.scrollIntoView({ behavior: "smooth", block: "center" }); target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1600); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !document.body.classList.contains("g3d-lock") && S.traceTurn && !/INPUT|TEXTAREA/.test((e.target || {}).tagName || "")) closeTrace();
  });
  window.addEventListener("hashchange", () => { applyHash(); render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

  /* ---------------------------------------------------------------- go */
  applyHash();
  render();
  document.title = document.title || "Code graph assistant";
  if (boot.poll) setInterval(poll, 2500);
  if (boot.lib && turnsOf().length) setTimeout(() => loadLibrary(boot.lib).catch(() => {}), 600);   // ready by the time the trace opens
  window.__codekg = { state: S, render, openTrace, closeTrace };
})();
