<style>
/* Code graph assistant screens. Palette: Cepheid blue #007AC2 (sampled from the logo) and the Streamlit app's theme. */
:root {
  --blue: #007AC2; --blue-700: #00679F; --blue-800: #00547F; --blue-900: #004060; --blue-950: #002D43;
  --blue-500: #3395D3; --blue-400: #66AFDE; --blue-300: #99CAE9; --blue-200: #CCE4F4; --blue-100: #E6F2FA; --blue-50: #F2F8FD;
  --bg: #FFFFFF; --bg-soft: #EEF5FB; --side: #F2F8FD; --line: #D5E4F1; --line-strong: #B9D3E8;
  --ink: #1A2B3C; --muted: #5C6B7A; --faint: #8696A6; --code-bg: #F4F8FC; --code-ink: #005B91;
  --ok: #2E9E5B; --ok-bg: #E8F6EE; --warn: #9A6B00; --warn-bg: #FFF6E0; --err: #D64545; --err-bg: #FDECEC; --gold: #FFB000; --amber: #E8A25B;
  --r: 10px; --r-lg: 14px;
  --font: "Source Sans 3", "Source Sans Pro", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 15px/1.5 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body.g3d-lock { overflow: hidden; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }
code, .mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--blue-400); outline-offset: 2px; border-radius: 6px; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: #C5D8E8; border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #9DBBD3; background-clip: padding-box; border: 3px solid transparent; }
.ic { display: inline-flex; flex: none; vertical-align: middle; }
.boot { padding: 40px; color: var(--muted); }

/* ---------------------------------------------------------------- layout */
.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); height: 100vh; overflow: hidden; }
.app.has-trace { grid-template-columns: 276px minmax(360px, 1fr) minmax(580px, 52vw); }
.side { background: var(--side); border-right: 1px solid var(--line); overflow: auto; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.scroll { flex: 1; overflow: auto; scroll-behavior: smooth; }
.trace { display: none; border-left: 1px solid var(--line); background: #fff; overflow: auto; min-width: 0; }
.app.has-trace .trace { display: block; }
.scrim { display: none; }

.topbar { flex: none; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 24px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .94); position: relative; z-index: 3; }
.topbar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--blue); }
.topbar-logo, .menu-btn { display: none; }
.topbar-title { flex: 1; min-width: 0; }
.topbar-title .t1 { font-size: 17px; font-weight: 700; color: var(--blue-950); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title .t2 { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-right: 4px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2.2s infinite; }
.live.paused i { background: var(--faint); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 158, 91, .45); } 70% { box-shadow: 0 0 0 7px rgba(46, 158, 91, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 158, 91, 0); } }

/* ---------------------------------------------------------------- buttons, chips, badges */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); border-radius: 8px; font: 600 13.5px var(--font); cursor: pointer; text-decoration: none; transition: background .12s, border-color .12s, color .12s; white-space: nowrap; }
.btn:hover { background: var(--blue-50); border-color: var(--blue-300); text-decoration: none; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-700); border-color: var(--blue-700); }
.btn-sm { height: 30px; padding: 0 11px; font-size: 13px; }
.btn-block { width: 100%; justify-content: center; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; }
.icon-btn:hover { background: var(--blue-100); color: var(--blue-800); }
.link-btn { border: 0; background: none; color: var(--blue); font: 600 13px var(--font); cursor: pointer; padding: 4px 6px; }
.link-btn:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); font: 600 11.5px var(--font); white-space: nowrap; }
.chip.blue { background: var(--blue-100); border-color: var(--blue-200); color: var(--blue-800); }
.chip.gold { background: #FFF4D6; border-color: #F5D98B; color: #7A5A00; }
.chip.action { cursor: pointer; font-size: 12.5px; padding: 4px 11px; background: var(--blue-50); border-color: var(--blue-200); color: var(--blue-800); }
.chip.action:hover { background: var(--blue-100); border-color: var(--blue-300); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); font: 600 12.5px var(--font); }
.badge.blue { background: var(--blue-100); border-color: var(--blue-200); color: var(--blue-800); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex: none; }
.cap { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 4px 0 2px; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; background: var(--code-bg); border: 1px solid #E3EEF8; border-radius: 8px; padding: 8px 11px; }
.note-inline { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.alert { display: flex; gap: 8px; align-items: flex-start; background: var(--err-bg); color: #9B2C2C; border: 1px solid #F3C4C4; border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.alert.warn { background: var(--warn-bg); color: #7A5200; border-color: #F0DCA8; }
.alert .ic { margin-top: 2px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--blue-950); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 300; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- sidebar */
.brand { display: block; padding: 2px 2px 4px; }
.brand img { display: block; height: auto; mix-blend-mode: multiply; }
.side-sec h3 { margin: 0 0 9px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 9px 12px; }
.stat-v { font-size: 23px; font-weight: 700; color: var(--blue-800); line-height: 1.15; letter-spacing: -.01em; }
.stat-l { font-size: 12px; color: var(--muted); margin-top: 1px; }
.facts { list-style: none; margin: 11px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--muted); }
.facts li { display: flex; gap: 8px; align-items: flex-start; }
.facts li .ic { color: var(--blue); margin-top: 2px; }
.facts b { color: var(--ink); font-weight: 600; }
.convo, .past { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.convo-item { display: grid; grid-template-columns: 22px 1fr; gap: 0 8px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 9px; padding: 8px 9px; cursor: pointer; color: var(--ink); }
.convo-item:hover { background: #fff; border-color: var(--line); }
.convo-item.on { background: #fff; border-color: var(--blue-300); }
.convo-route { grid-row: 1 / 3; width: 22px; height: 22px; border-radius: 7px; background: var(--blue-100); color: var(--blue-800); display: grid; place-items: center; margin-top: 1px; }
.convo-q { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.convo-m { font-size: 11.5px; color: var(--muted); }
.past a { display: block; padding: 7px 9px; border-radius: 9px; color: var(--ink); }
.past a:hover { background: #fff; text-decoration: none; }
.past-q { display: block; font-size: 13px; font-weight: 600; line-height: 1.3; }
.past-m { display: block; font-size: 11.5px; color: var(--muted); }
.how summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--blue-800); display: flex; gap: 8px; align-items: center; list-style: none; }
.how summary::-webkit-details-marker { display: none; }
.how ol { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.how b { color: var(--ink); }
.side-foot { margin-top: auto; font-size: 11.5px; color: var(--faint); line-height: 1.5; padding-top: 6px; }

/* ---------------------------------------------------------------- home */
.home { max-width: 1020px; margin: 0 auto; padding: 26px 28px 70px; }
.hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--blue-50); padding: 34px 38px 32px; margin-bottom: 30px; }
.swoosh { position: absolute; right: 0; top: 0; bottom: 0; width: 52%; pointer-events: none; }
.swoosh svg { width: 100%; height: 100%; display: block; }
.hero-body { position: relative; max-width: 640px; }
.hero-logo { display: block; height: auto; mix-blend-mode: multiply; margin: 0 0 20px -4px; }
.hero h1 { margin: 0 0 6px; font-size: 32px; line-height: 1.15; color: var(--blue-950); letter-spacing: -.015em; }
.hero-sub { margin: 0 0 12px; font-size: 16.5px; font-weight: 600; color: var(--blue-800); }
.hero-text { margin: 0 0 18px; color: var(--ink); max-width: 560px; }
.hero-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.hero-cta code { font-size: 13px; background: #fff; border: 1px solid var(--blue-200); color: var(--blue-800); padding: 6px 11px; border-radius: 8px; }
.kbd-hint { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 13px; }
.block { margin: 0 0 32px; }
.block h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; font-size: 19px; color: var(--blue-950); }
.block h2 .ic { color: var(--blue); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: #fff; }
.kpi-v { font-size: 26px; font-weight: 700; color: var(--blue-800); line-height: 1.1; letter-spacing: -.01em; }
.kpi-l { font-size: 12.5px; color: var(--muted); }
.areas { margin-top: 16px; display: grid; gap: 5px; max-width: 620px; }
.area { display: grid; grid-template-columns: 62px 1fr 28px; align-items: center; gap: 10px; font-size: 13px; }
.area-n { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.area-bar { height: 9px; border-radius: 5px; background: var(--blue-100); overflow: hidden; }
.area-bar i { display: block; height: 100%; background: var(--blue); border-radius: 5px; }
.area-c { text-align: right; font-weight: 600; color: var(--blue-800); }
.suggest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.suggest { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 2px 12px; text-align: left; border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: 14px 16px; cursor: pointer; color: var(--ink); transition: border-color .15s, transform .15s, background .15s; }
.suggest:hover { border-color: var(--blue-300); background: var(--blue-50); transform: translateY(-1px); }
.suggest-ic { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 11px; background: var(--blue-100); color: var(--blue-800); display: grid; place-items: center; }
.suggest-t { font-weight: 700; line-height: 1.3; padding-right: 48px; }
.suggest-route { font-size: 12px; color: var(--muted); }
.suggest-copy { position: absolute; right: 12px; top: 12px; display: inline-flex; gap: 4px; align-items: center; font-size: 11.5px; color: var(--blue); opacity: 0; transition: opacity .15s; }
.suggest:hover .suggest-copy { opacity: 1; }
.flow { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; counter-reset: f; }
.flow li { position: relative; border: 1px solid var(--line); border-radius: 13px; padding: 14px 14px 14px; background: #fff; }
.flow li:not(:last-child)::after { content: ""; position: absolute; right: -13px; top: 32px; width: 14px; border-top: 2px solid var(--blue-300); }
.flow-n { position: absolute; right: 12px; top: 10px; font-size: 12px; font-weight: 700; color: var(--blue-300); }
.flow-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--blue-100); color: var(--blue-800); display: grid; place-items: center; margin-bottom: 9px; }
.flow b { display: block; color: var(--blue-950); }
.flow p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }

/* ---------------------------------------------------------------- question library and insight card */
.side-actions { display: flex; flex-direction: column; gap: 8px; }
.lib { display: flex; flex-direction: column; gap: 10px; }
.lib-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lib-top .lib-pills { flex: 1; min-width: 280px; }
.lib-intro { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 760px; }
.lib-searchbox { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 9px; background: #fff; color: var(--muted); margin-left: auto; }
.lib-searchbox:focus-within { border-color: var(--blue-400); }
.lib-search { border: 0; outline: 0; background: transparent; font: 14px var(--font); width: 200px; color: var(--ink); }
.lib-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.lib-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: #fff; color: var(--muted); font: 600 13px var(--font); cursor: pointer; }
.lib-pill:hover { border-color: var(--blue-300); color: var(--blue-800); }
.lib-pill.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.lib-count { font-size: 12.5px; color: var(--muted); min-height: 0; }
.lib-count:empty { display: none; }
.lib-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.lib-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lib-card { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: 13px 15px 12px; transition: border-color .15s; }
.lib-card:hover { border-color: var(--blue-300); }
.lib-badges { display: flex; flex-wrap: wrap; gap: 5px; }
.lib-card h4 { margin: 4px 0 0; font-size: 15.5px; color: var(--blue-950); line-height: 1.3; }
.lib-q { margin: 0; font-size: 14px; line-height: 1.45; }
.lib-why { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.lib-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; }
.lib-kind { font-size: 11.5px; color: var(--faint); }
.lib-dialog { width: min(1180px, 94vw); max-height: 88vh; padding: 0; border: 1px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); overflow: hidden; }
.lib-dialog::backdrop { background: rgba(0, 45, 67, .4); }
.lib-dialog[open] { display: flex; flex-direction: column; }
.lib-dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 17px; color: var(--blue-950); }
.lib-dialog-head b { display: inline-flex; gap: 9px; align-items: center; }
.lib-dialog-head .ic { color: var(--blue); }
.lib-dialog .lib { padding: 16px 18px 20px; overflow: auto; }
.flow-note { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; font-size: 13px; }
.flow-note .ic { color: var(--blue); margin-top: 2px; }

.insight { border: 1px solid var(--blue-200); border-radius: var(--r-lg); background: #fff; padding: 12px 16px 12px; margin: 4px 0 14px; border-top: 3px solid var(--blue); }
.insight-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; color: var(--blue-950); }
.insight-ic { width: 28px; height: 28px; border-radius: 8px; background: var(--blue-100); color: var(--blue-800); display: grid; place-items: center; }
.insight-head b { font-size: 15.5px; }
.insight-meta { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--ok); background: var(--ok-bg); border: 1px solid #BFE5CF; border-radius: 999px; padding: 1px 10px; }
.insight-headline { margin: 9px 0 10px; font-size: 15px; line-height: 1.5; color: var(--ink); }
.insight .metrics { margin: 0 0 8px; }
.insight .metric-v { font-size: 21px; }
.insight-rows .tbl-wrap { margin: 6px 0 2px; }
.insight-rows .tbl-wrap.tall { max-height: 540px; }
.insight-cap { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.insight-foot { display: flex; gap: 7px; align-items: flex-start; margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--faint); line-height: 1.4; }
.insight-foot .ic { margin-top: 1px; }

/* ---------------------------------------------------------------- conversation */
.thread { max-width: 880px; margin: 0 auto; padding: 26px 30px 150px; }
.turn { margin-bottom: 38px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg { display: flex; gap: 13px; align-items: flex-start; }
.msg.user { margin-bottom: 16px; }
.avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.avatar.user { background: var(--blue-100); color: var(--blue-800); }
.avatar.bot { background: var(--blue); color: #fff; }
.bubble { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 9px 15px; font-size: 16px; font-weight: 500; max-width: 100%; line-height: 1.45; }
.bot-body { flex: 1; min-width: 0; }
.thought { margin: 0 0 10px; }
.thought > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; color: var(--muted); font-size: 13.5px; padding: 4px 12px 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: #fff; user-select: none; }
.thought > summary::-webkit-details-marker { display: none; }
.thought > summary:hover { border-color: var(--blue-300); color: var(--blue-800); }
.thought .chev { transition: transform .15s; }
.thought[open] .chev { transform: rotate(90deg); }
.timeline { list-style: none; margin: 10px 0 4px 6px; padding: 0 0 0 4px; display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--blue-100); }
.timeline li { display: flex; gap: 11px; padding: 6px 0 6px 14px; position: relative; }
.tl-ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); margin-left: -27px; border: 2px solid #fff; }
.timeline li.error .tl-ic { background: var(--err-bg); color: var(--err); }
.tl-label { font-weight: 600; font-size: 13.5px; }
.tl-cap { font-size: 12.5px; color: var(--muted); word-break: break-word; }
.tl-cap code { font-size: 11.5px; }

.prose { font-size: 15.5px; line-height: 1.64; }
.prose > :first-child { margin-top: 0; }
.prose p { margin: 0 0 .8em; }
.prose ul, .prose ol { margin: .3em 0 .95em; padding-left: 1.4em; }
.prose li { margin: .3em 0; }
.prose li > ul, .prose li > ol { margin: .25em 0 .35em; }
.prose h3, .prose h4, .prose h5 { margin: 1.1em 0 .4em; color: var(--blue-950); line-height: 1.3; }
.prose h3 { font-size: 1.15em; } .prose h4 { font-size: 1.05em; } .prose h5 { font-size: 1em; }
.prose code, .tl-cap code, .src code, .note code, .insp-title code { font: 12.5px var(--mono); background: var(--code-bg); color: var(--code-ink); padding: 1px 6px; border-radius: 5px; border: 1px solid #E3EEF8; }
.prose a code { color: var(--blue); }
.prose strong { color: var(--blue-950); }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.prose blockquote { margin: .8em 0; padding: 4px 14px; border-left: 3px solid var(--blue-300); color: var(--muted); background: var(--blue-50); border-radius: 0 8px 8px 0; }
.prose pre.code { font: 12.5px/1.5 var(--mono); background: var(--code-bg); border: 1px solid #E3EEF8; border-radius: 9px; padding: 10px 12px; overflow: auto; }
.prose pre.code code { background: none; border: 0; padding: 0; color: var(--ink); }
.prose > p:last-child em:only-child { color: var(--muted); font-size: 13px; }
a.cite { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; margin-left: 3px; border-radius: 9px; background: var(--blue-100); color: var(--blue-800); font: 700 10.5px var(--font); vertical-align: 2px; text-decoration: none; }

.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 9px; margin: 8px 0; }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { position: sticky; top: 0; background: #EAF3FA; color: var(--blue-900); text-align: left; font-weight: 700; font-size: 12px; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid #EDF3F9; vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--blue-50); }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl .val { word-break: break-word; font-family: var(--mono); font-size: 12px; }
.sm { font-size: 12px; }

.sources { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px 10px; margin: 14px 0 12px; background: #fff; }
.sources-head { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 4px; color: var(--blue-950); }
.sources-head .ic { color: var(--blue); }
.sources-head em { font-style: normal; font-weight: 500; color: var(--muted); }
.srclist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.src { display: flex; gap: 11px; padding: 9px 6px; border-radius: 9px; align-items: flex-start; transition: background .25s; }
.src:hover { background: var(--blue-50); }
.src.flash { background: var(--blue-100); }
.src-n { flex: none; width: 23px; height: 23px; border-radius: 7px; background: var(--blue-100); color: var(--blue-800); font: 700 12px var(--font); display: grid; place-items: center; margin-top: 1px; }
.src-main { flex: 1; min-width: 0; }
.src-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.src-title > a:first-child { font-weight: 600; }
.src-latest { font-size: 12px; }
.src-where { color: var(--muted); font-size: 12.5px; margin-top: 2px; word-break: break-word; }
.src-sum { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.src-open { flex: none; color: var(--faint); padding: 4px; border-radius: 6px; margin-top: -1px; }
.src-open:hover { color: var(--blue); background: var(--blue-100); text-decoration: none; }
.sources > .link-btn { margin: 2px 0 0 36px; }

.tracecard { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; border: 1px solid var(--blue-200); border-radius: 13px; background: var(--blue-50); padding: 10px 16px 10px 10px; cursor: pointer; margin: 6px 0 10px; color: var(--ink); transition: border-color .15s, background .15s; }
.tracecard:hover { border-color: var(--blue-400); background: var(--blue-100); }
.tracecard.on { border-color: var(--blue); background: var(--blue-100); }
.constellation { flex: none; border-radius: 9px; background: #fff; border: 1px solid var(--line); padding: 2px; line-height: 0; }
.tracecard-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tracecard-t { display: flex; gap: 8px; align-items: center; font-weight: 700; color: var(--blue-900); }
.tracecard-t .ic { color: var(--blue); }
.tracecard-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; color: var(--faint); font-size: 12.5px; }
.tf { display: inline-flex; gap: 5px; align-items: center; background: #fff; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 1px 9px; }
.tf.ok { color: var(--ok); border-color: #BFE5CF; background: var(--ok-bg); }
.tracecard-cta { display: inline-flex; gap: 5px; align-items: center; color: var(--blue); font-weight: 600; font-size: 13px; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.meta { margin-left: auto; color: var(--faint); font-size: 12px; }

.dock { position: sticky; bottom: 14px; margin-top: 8px; background: rgba(255, 255, 255, .97); border: 1px solid var(--blue-300); border-radius: 14px; padding: 9px 14px; box-shadow: 0 10px 30px rgba(0, 64, 96, .10); display: flex; flex-direction: column; gap: 7px; }
.dock-main { display: flex; gap: 11px; align-items: center; font-size: 13.5px; color: var(--muted); }
.dock-main b { color: var(--blue-950); }
.dock-ic { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--blue); color: #fff; display: grid; place-items: center; }
.dock-ups { display: flex; flex-wrap: wrap; gap: 5px 7px; align-items: center; padding-left: 41px; }
.dock-ups .cap { margin: 0 4px 0 0; }
.dock-ups .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

/* ---------------------------------------------------------------- trace panel */
.trace-head { position: sticky; top: 0; z-index: 6; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 22px 12px; }
.trace-bar { display: flex; align-items: center; justify-content: space-between; }
.trace-kicker { display: flex; gap: 8px; align-items: center; color: var(--blue); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
.trace-q { font-size: 18px; font-weight: 700; margin: 4px 0 10px; line-height: 1.3; color: var(--blue-950); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.trace-body { padding: 18px 22px 48px; }
.tsteps-tools { display: flex; align-items: center; gap: 4px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.tsteps-tools span { flex: 1; }
.tsteps { display: flex; flex-direction: column; gap: 12px; }
.tstep { border: 1px solid var(--line); border-radius: var(--r-lg); background: #fff; overflow: hidden; scroll-margin-top: 128px; }
.tstep-head { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 15px; background: #fff; border: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.tstep-head:hover { background: var(--blue-50); }
.tstep.open .tstep-head { background: var(--blue-50); border-bottom: 1px solid var(--line); }
.tstep-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; font: 700 13px var(--font); display: grid; place-items: center; }
.tstep-ic { color: var(--blue); display: inline-flex; }
.tstep-title { flex: 1; font-weight: 700; color: var(--blue-950); min-width: 0; }
.tstep-title em { font-style: normal; font-weight: 500; color: var(--muted); margin-left: 9px; font-size: 13px; }
.tstep-chev { color: var(--faint); transition: transform .15s; }
.tstep.open .tstep-chev { transform: rotate(180deg); }
.tstep-body { display: none; padding: 15px 16px 18px; }
.tstep.open .tstep-body { display: block; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.lede { margin: 0; color: var(--ink); font-size: 14px; }
.route-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--blue-200); background: var(--blue-50); border-radius: 12px; padding: 10px 14px; }
.route-ic { flex: none; width: 40px; height: 40px; border-radius: 11px; background: var(--blue); color: #fff; display: grid; place-items: center; }
.route-name { font-weight: 700; color: var(--blue-950); }
.route-blurb { color: var(--muted); font-size: 13px; }
.codeblock { position: relative; }
.codeblock .copy-btn { position: absolute; right: 7px; top: 7px; width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255, 255, 255, .92); color: var(--muted); border-radius: 7px; cursor: pointer; opacity: 0; transition: opacity .12s; z-index: 2; }
.codeblock:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
.copy-btn:hover { color: var(--blue); border-color: var(--blue-300); }
pre.code { margin: 0; font: 12.5px/1.55 var(--mono); background: var(--code-bg); border: 1px solid #E3EEF8; border-radius: 9px; padding: 10px 40px 10px 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
.codeblock.tall pre.code { max-height: 420px; }
.tk-key { color: #005B91; } .tk-str { color: #2E7D5B; } .tk-num { color: #B35C00; } .tk-lit { color: #7A3FB0; }
.tk-kw { color: #007AC2; font-weight: 700; } .tk-lab { color: #2E7D5B; } .tk-par { color: #B35C00; } .tk-fn { color: #7A3FB0; }
.tabs-wrap { display: flex; flex-direction: column; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tab { border: 0; background: transparent; padding: 8px 13px; cursor: pointer; font: 600 13px var(--font); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--blue-800); }
.tab.on { color: var(--blue); border-bottom-color: var(--blue); }
.tab-l { display: inline-flex; align-items: center; gap: 6px; }
.tab-err { width: 7px; height: 7px; border-radius: 50%; background: var(--err); }
.tab-warn { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.tab-body > * { animation: rise .2s ease both; }
.channels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.channel { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fff; border-top: 3px solid var(--blue-300); }
.channel.names { border-top-color: var(--blue-700); } .channel.text { border-top-color: var(--blue-400); } .channel.vector { border-top-color: #00A3AD; }
.channel-n { font-size: 22px; font-weight: 700; color: var(--blue-800); line-height: 1.1; }
.channel-l { font-size: 12.5px; font-weight: 700; margin-top: 2px; }
.channel-d { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filters .cap { margin: 0 4px 0 0; }
.type { display: inline-flex; align-items: center; white-space: nowrap; }
.rank { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #FFF4D6; border: 1px solid #F5D98B; color: #7A5A00; font: 700 11.5px var(--font); }
.bar-cell { display: inline-flex; align-items: center; gap: 8px; }
.bar { display: inline-block; width: 64px; height: 7px; border-radius: 4px; background: var(--blue-100); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font: 600 11px var(--font); padding: 1px 8px; border-radius: 999px; background: var(--blue-100); color: var(--blue-800); white-space: nowrap; }
.pill.vector { background: #DDF3F4; color: #00686E; } .pill.graph_links { background: #FFF1DC; color: #8A5200; }
.raw summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--blue-800); padding: 4px 0; }
.raw[open] summary { margin-bottom: 8px; }
.pillbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.pillbar .cap { margin: 0 4px 0 0; }
.spill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: #fff; color: var(--muted); font: 600 12.5px var(--font); cursor: pointer; }
.spill:hover { border-color: var(--blue-300); }
.spill.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.tbl-host { margin-top: 4px; }
.rel-badge { display: inline-block; font: 600 11.5px var(--font); padding: 1px 8px; border-radius: 6px; background: #E8EEF4; color: #3E5368; }
.rel-badge.path { background: #FFF1DC; color: #8A5200; } .rel-badge.context { background: var(--blue-100); color: var(--blue-800); }
.ctx-row { cursor: pointer; }
.ctx-row.on td { background: var(--blue-100); }
.ctx-view { margin-top: 4px; }
.writer { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); background: var(--blue-50); border-radius: 11px; padding: 10px 14px; }
.writer .ic { color: var(--blue); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.metric { border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; background: #fff; }
.metric-v { font-size: 24px; font-weight: 700; color: var(--blue-800); line-height: 1.15; }
.metric-l { font-size: 12px; color: var(--muted); }
.metric.warn { background: var(--warn-bg); border-color: #F0DCA8; } .metric.warn .metric-v { color: var(--warn); }

/* ---------------------------------------------------------------- 3D scene */
.g3d { position: relative; width: 100%; overflow: hidden; border-radius: 12px; border: 1px solid #D5E4F1; background: #F4F8FC; container-type: inline-size; font-family: var(--font); }
.g3d.full { position: fixed; inset: 0; z-index: 120; height: 100vh !important; border-radius: 0; border: 0; }
.g3d-canvas { position: absolute; inset: 0; }
.g3d-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.g3d-label { position: absolute; left: 0; top: 0; font-size: 11px; line-height: 14px; color: #1A2B3C; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; transition: opacity .15s; }
.g3d-label.hit { font-weight: 600; }
.g3d-label.question { font-weight: 700; color: #007AC2; }
.g3d-label.dim { opacity: .15; }
.g3d-label.sel { font-weight: 700; color: #00547F; }
.g3d-tools { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; z-index: 4; pointer-events: none; }
.g3d-tools > * { pointer-events: auto; }
.g3d-searchbox { display: inline-flex; align-items: center; gap: 6px; margin-right: auto; height: 30px; padding: 0 10px; border: 1px solid #D5E4F1; border-radius: 8px; background: rgba(255, 255, 255, .94); color: var(--muted); }
.g3d-search { border: 0; outline: 0; background: transparent; font: 13px var(--font); width: 150px; color: var(--ink); }
.g3d-found { font-size: 11.5px; font-weight: 700; color: var(--blue); } .g3d-found.none { color: var(--err); }
.g3d-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid #D5E4F1; background: rgba(255, 255, 255, .94); color: var(--ink); font: 600 12.5px var(--font); cursor: pointer; }
.g3d-btn:hover { border-color: var(--blue-300); background: #fff; }
.g3d-btn.on { background: var(--blue); border-color: var(--blue); color: #fff; }
@container (max-width: 640px) { .g3d-btn span { display: none; } .g3d-btn { padding: 0 9px; } .g3d-search { width: 110px; } }
.g3d-legend { position: absolute; left: 10px; top: 50px; display: flex; flex-direction: column; gap: 3px; z-index: 3; max-height: calc(100% - 120px); overflow: auto; }
.g3d-key { display: inline-flex; align-items: center; gap: 6px; font: 11.5px var(--font); color: #1A2B3C; padding: 2px 8px; border-radius: 6px; background: rgba(255, 255, 255, .8); border: 0; cursor: pointer; text-align: left; }
.g3d-key:hover { background: #fff; }
.g3d-key.off { opacity: .38; text-decoration: line-through; }
.g3d-key span { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.g3d-key em { font-style: normal; color: var(--faint); margin-left: 2px; }
.g3d-kinds { position: absolute; left: 10px; bottom: 28px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: #3E5368; z-index: 3; pointer-events: none; background: rgba(244, 248, 252, .86); padding: 2px 6px; border-radius: 6px; }
.g3d-kind { display: inline-flex; align-items: center; gap: 6px; }
.g3d-kind i { display: inline-block; width: 20px; height: 0; border-top: 2px solid #5B7A99; }
.g3d-kind.path i { border-color: #E8A25B; } .g3d-kind.context i { border-color: #8FBCE3; border-top-style: dotted; border-top-width: 3px; }
.g3d-hint { position: absolute; left: 10px; right: 10px; bottom: 8px; font-size: 11px; color: #5C6B7A; pointer-events: none; z-index: 3; }
.g3d-btn:disabled { opacity: .45; cursor: not-allowed; }
.g3d-replay { position: absolute; left: 50%; top: 52px; transform: translate(-50%, -6px); background: var(--blue-950); color: #fff; font: 600 12.5px var(--font); padding: 6px 14px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 5; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.g3d-replay.show { opacity: .94; transform: translate(-50%, 0); }
.g3d-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 13px; color: #5C6B7A; background: #F4F8FC; z-index: 6; }
.g3d-inspector { position: absolute; top: 50px; right: 10px; bottom: 30px; width: 276px; z-index: 5; background: rgba(255, 255, 255, .97); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; overflow: auto; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0, 64, 96, .12); }
.g3d-inspector[hidden] { display: none; }
.insp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.insp-type { display: inline-flex; align-items: center; gap: 6px; font: 700 11.5px var(--font); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.insp-type i, .insp-node i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.insp-title { font-weight: 700; font-size: 14px; line-height: 1.3; word-break: break-word; color: var(--blue-950); }
.insp-where { color: var(--muted); font-size: 12px; margin-top: 3px; word-break: break-word; }
.insp-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 4px; }
.insp-line { margin: 4px 0; color: var(--muted); }
.insp-sig { font: 12px var(--mono); color: var(--code-ink); background: var(--code-bg); border-radius: 6px; padding: 4px 8px; margin: 6px 0; word-break: break-word; }
.insp-summary { margin: 6px 0; color: var(--ink); line-height: 1.45; }
.insp-asof { display: flex; gap: 6px; align-items: center; color: var(--faint); font-size: 11.5px; margin: 6px 0; }
.insp-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.insp-sec { margin: 12px 0 6px; font: 700 11.5px var(--font); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.insp-grp { margin-bottom: 9px; }
.insp-rel { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
.insp-rel em { font-style: normal; margin-left: auto; font-weight: 700; color: var(--blue-800); }
.insp-node { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; border: 0; background: transparent; padding: 3px 6px; border-radius: 6px; cursor: pointer; font: 12.5px var(--font); color: var(--ink); }
.insp-node:hover { background: var(--blue-50); color: var(--blue-800); }
.insp-more { color: var(--faint); font-size: 12px; padding-left: 6px; }
.scene-tooltip { color: var(--ink) !important; font-family: var(--font) !important; }
.tip { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font: 12px/1.4 var(--font); max-width: 330px; white-space: normal; box-shadow: 0 6px 18px rgba(0, 45, 67, .16); color: var(--ink); }
.tip i { color: var(--muted); }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 1240px) {
  .app.has-trace { grid-template-columns: 276px minmax(0, 1fr); }
  .app.has-trace .trace { position: fixed; right: 0; top: 0; bottom: 0; width: min(100vw, 880px); z-index: 60; box-shadow: -16px 0 40px rgba(0, 45, 67, .16); }
  .app.has-trace .scrim { display: block; position: fixed; inset: 0; z-index: 50; background: rgba(0, 45, 67, .28); }
  .flow { grid-template-columns: repeat(2, 1fr); } .flow li::after { display: none; }
  .lib-grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .app, .app.has-trace { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 300px; z-index: 70; transform: translateX(-102%); transition: transform .2s; box-shadow: 16px 0 40px rgba(0, 45, 67, .18); }

   codekg/graph3d.py, plus: inspector, find, step filter, replay, fullscreen and a flat 2D map. */

const REL_SIZE = 4;
const FADED = "#D3DDE8";
const HIGHLIGHT = "#007AC2";
const FLASH = "#FFB000";
const EDGE_TIP = { graph: "relationship returned by the graph", path: "derived over several hops", context: "how the agent got there" };

let libPromise = null;
function loadLibrary(src) {
  if (window.ForceGraph3D) return Promise.resolve(window.ForceGraph3D);
  if (!src) return Promise.reject(new Error("the 3D library is not available on this page"));
  if (!libPromise) {
    libPromise = new Promise((resolve, reject) => {
      const s = h("script", { src });
      s.onload = () => (window.ForceGraph3D ? resolve(window.ForceGraph3D) : reject(new Error("the 3D library did not initialise")));
      s.onerror = () => { s.remove(); libPromise = null; reject(new Error("could not load " + src)); };
      document.head.append(s);
    });
  }
  return libPromise;
}

function hasWebGL() {
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { return false; }
}

/* the same sizes, colours and label rules as trace_view.graph3d_data */
function buildGraphData(sg) {
  const small = sg.nodes.length <= 25;
  const nodes = sg.nodes.map((n) => {
    const hit = n.hit, label = n.label, question = n.key === "question";
    const marker = !question && MARKERS.includes(label);
    let name = question ? "Question" : shortName(n.name, marker ? "Search" : label);
    if (hit) name = `#${hit} ${name}`;
    const val = question ? 16 : marker ? 8 : hit ? 11 - Math.min(hit, 6) : n.target || n.expanded ? 7 : n.focus ? 4 : 1.8;
    const prominent = !!(question || hit || n.target || n.expanded || n.focus || label === "Search" || label === "Insight");
    return {
      id: n.key, name, full: n.name, label, val, color: NODE_COLORS[label] || "#8A97A6", url: n.url || null, repo: n.repo || null,
      path: n.path && n.path !== n.name ? n.path : null,
      summary: n.summary && !/^(null|none|nan)$/i.test(String(n.summary).trim()) ? clip(n.summary, 260) : null, hit: hit || null,
      via: (n.matched_by || []).join(" \u00b7 ") || null, rrf: n.rrf || null, signature: n.signature || null, asOf: n.as_of || null,
      stepList: n.steps || [], steps: (n.steps || []).join(", "), prominent, small, question, target: !!n.target, expanded: !!n.expanded,
      focus: !!n.focus,
    };
  });
  const links = sg.edges.map((e) => ({
    source: e.source, target: e.target, type: e.type, kind: e.kind, undirected: !!e.undirected,
    detail: EDGE_DETAILS.filter((k) => e[k]).map((k) => `${k} ${e[k]}`).join(" \u00b7 ") || null,
    stepList: e.steps || [], steps: (e.steps || []).join(", "),
  }));
  const counts = {};
  for (const n of sg.nodes) counts[n.label] = (counts[n.label] || 0) + 1;
  const legend = Object.keys(counts).map((label) => ({ label, color: NODE_COLORS[label] || "#8A97A6", count: counts[label] }));
  return { nodes, links, legend };
}

function createGraph3D(opts) {
  const data = buildGraphData(opts.sg);
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const S = {
    g: null, data, byId: new Map(data.nodes.map((n) => [n.id, n])), adj: new Map(data.nodes.map((n) => [n.id, []])),
    hover: null, selected: null, hlN: new Set(), hlL: new Set(), hidden: new Set(), stepSel: null, spin: false, angle: 0,
    radius: 200, labels: new Map(), labelMode: "auto", flash: new Set(), match: null, dead: false, mode: "3d", raf: 0, fitted: false,
    replaying: false, lastClick: null, visCount: data.nodes.length,
  };
  const end = (x) => (typeof x === "object" ? x : S.byId.get(x));
  for (const l of data.links) { S.adj.get(l.source)?.push(l); S.adj.get(l.target)?.push(l); }

  /* ---- DOM */
  const box = h("div", { class: "g3d-canvas" });
  const labelLayer = h("div", { class: "g3d-labels" });
  const legend = h("div", { class: "g3d-legend", role: "group", "aria-label": "Node types" });
  const msg = h("div", { class: "g3d-msg" }, "Loading the 3D view\u2026");
  const found = h("span", { class: "g3d-found" });
  const search = h("input", { class: "g3d-search", type: "search", placeholder: "Find a node\u2026", "aria-label": "Find a node in the graph", autocomplete: "off" });
  const mkBtn = (act, ic, label, title, fn) => h("button", { type: "button", class: "g3d-btn", "data-act": act, title, onclick: fn }, icon(ic, 14), h("span", { class: "lbl" }, label));
  const setLabel = (btn, text) => { const l = btn.querySelector(".lbl"); if (l) l.textContent = text; };
  const btnFit = mkBtn("fit", "fit", "Fit", "Fit the whole graph in view", () => fit());
  const btnSpin = mkBtn("spin", "spin", "Spin", "Rotate the view automatically", () => setSpin(!S.spin));
  const btnLabels = mkBtn("labels", "tag", "Labels", "Show or hide node labels", () => cycleLabels());
  const btnMode = mkBtn("mode", "map", "2D map", "Flatten the graph into a 2D map", () => setMode(S.mode === "3d" ? "2d" : "3d"));
  const btnReplay = mkBtn("replay", "play", "Replay", "Replay how the agent explored the graph, step by step", () => (S.replaying ? stopReplay() : replay()));
  const btnFull = mkBtn("full", "fit", "Expand", "Fill the screen", () => toggleFull());
  const toolbar = h("div", { class: "g3d-tools" }, h("div", { class: "g3d-searchbox" }, icon("search", 14), search, found), btnFit, btnSpin, btnLabels, btnMode, btnReplay, btnFull);
  const kinds = h("div", { class: "g3d-kinds" }, ...Object.keys(EDGE_TIP).map((k) =>
    h("span", { class: "g3d-kind " + k, title: EDGE_TIP[k] }, h("i"), EDGE_TIP[k])));
  const hint = h("div", { class: "g3d-hint" }, "Drag to rotate \u00b7 scroll to zoom \u00b7 right-drag to pan \u00b7 click a node for details \u00b7 double-click opens GitHub \u00b7 right-click flies to it");
  const inspector = h("aside", { class: "g3d-inspector", hidden: true, "aria-live": "polite" });
  const replayCaption = h("div", { class: "g3d-replay", "aria-live": "polite" });
  const root = h("div", { class: "g3d", style: { height: (opts.height || 560) + "px" } }, box, labelLayer, legend, toolbar, kinds, hint, replayCaption, inspector, msg);

  /* ---- styling and visibility */
  const focusNode = () => S.hover || S.selected;
  const lit = (l) => S.hlL.has(l);
  const baseColor = (l) => KIND_COLORS[l.kind] || KIND_COLORS.graph;
  const nodeVisible = (n) => !!n && !S.hidden.has(n.label) && (!S.stepSel || n.question || n.stepList.some((s) => S.stepSel.has(s)))
    && (!S.revealed || S.revealed.has(n.id));
  const linkVisible = (l) => nodeVisible(end(l.source)) && nodeVisible(end(l.target)) && (!S.stepSel || l.stepList.some((s) => S.stepSel.has(s)));

  function highlight() {
    S.hlN.clear(); S.hlL.clear();
    const f = focusNode();
    if (!f) return;
    S.hlN.add(f);
    for (const l of S.adj.get(f.id) || []) { S.hlL.add(l); S.hlN.add(end(l.source)); S.hlN.add(end(l.target)); }
  }
  function applyStyles() {
    const g = S.g;
    if (!g) return;
    const f = focusNode();
    g.nodeColor((n) => (S.flash.has(n.id) ? FLASH : f ? (S.hlN.has(n) ? n.color : FADED) : S.match ? (S.match.has(n.id) ? n.color : FADED) : n.color))
      .linkColor((l) => (!f ? baseColor(l) : lit(l) ? HIGHLIGHT : "rgba(170, 190, 210, 0.25)"))
      .linkDirectionalArrowColor((l) => (!f ? baseColor(l) : lit(l) ? HIGHLIGHT : "rgba(170, 190, 210, 0.25)"))
      .linkWidth((l) => (lit(l) ? 2 : l.kind === "graph" ? 0.9 : 0.4))
      .linkDirectionalParticles((l) => (opts.static || reduceMotion ? 0 : l.kind === "context" || lit(l) ? 2 : 0));
  }
  function applyVisibility() {
    const g = S.g;
    S.visCount = S.data.nodes.filter(nodeVisible).length;
    if (g) g.nodeVisibility(nodeVisible).linkVisibility(linkVisible);
    $$(".g3d-key", legend).forEach((k) => k.classList.toggle("off", S.hidden.has(k.dataset.label)));
    if (S.selected && !nodeVisible(S.selected)) select(null);
  }
  function refresh() { highlight(); applyStyles(); }

  /* ---- selection, focus, inspector */
  function select(n, fly) {
    S.selected = n || null;
    refresh();
    showInspector(S.selected);
    if (n && fly) focus(n);
  }
  function focus(n) {
    if (!S.g || n.x === undefined) return;
    setSpin(false);
    S.userMoved = true;                                           // a fly-to is a deliberate camera move: do not auto-refit over it
    if (S.mode === "2d") { S.g.cameraPosition({ x: n.x, y: n.y, z: 120 }, { x: n.x, y: n.y, z: 0 }, 700); return; }
    // keep the viewing direction, move in close enough to read the neighbourhood but not inside the cluster
    const b = S.g.getGraphBbox();
    const size = b ? Math.max(b.x[1] - b.x[0], b.y[1] - b.y[0], b.z[1] - b.z[0]) : 200;
    const dist = Math.max(80, size * 0.55);
    const cam = S.g.cameraPosition();
    const dx = cam.x - n.x, dy = cam.y - n.y, dz = cam.z - n.z;
    const len = Math.hypot(dx, dy, dz) || 1;
    S.g.cameraPosition({ x: n.x + (dx / len) * dist, y: n.y + (dy / len) * dist, z: n.z + (dz / len) * dist }, n, 900);
  }
  function openNode(n) { if (n && n.url) window.open(n.url, "_blank", "noopener"); else if (n) focus(n); }
  function showInspector(n) {
    inspector.replaceChildren();
    inspector.hidden = !n;
    if (!n) return;
    const groups = new Map();
    for (const l of S.adj.get(n.id) || []) {
      if (!linkVisible(l)) continue;
      const out = end(l.source) === n;
      const other = out ? end(l.target) : end(l.source);
      const key = `${out ? "out" : "in"}|${l.type}`;
      if (!groups.has(key)) groups.set(key, { type: l.type, out, kind: l.kind, undirected: l.undirected, items: [] });
      groups.get(key).items.push({ other, detail: l.detail });
    }
    const conn = [...groups.values()].sort((a, b) => b.items.length - a.items.length);
    const total = conn.reduce((s, c) => s + c.items.length, 0);
    // built through h(), not Element.append: the native append turns a null placeholder into the literal text "null"
    inspector.append(h("div", { class: "insp-inner" },
      h("div", { class: "insp-head" },
        h("span", { class: "insp-type" }, h("i", { style: { background: n.color } }), n.label),
        h("button", { type: "button", class: "icon-btn", title: "Close", "aria-label": "Close details", onclick: () => select(null) }, icon("x", 14))),
      h("div", { class: "insp-title" }, n.full),
      n.repo || n.path ? h("div", { class: "insp-where" }, [n.repo, n.path].filter(Boolean).join(" \u00b7 ")) : null,
      h("div", { class: "insp-chips" },
        n.hit ? h("span", { class: "chip gold" }, `search hit #${n.hit}`) : null,
        n.target ? h("span", { class: "chip blue" }, "target") : null,
        n.focus ? h("span", { class: "chip blue" }, "what the insight is about") : null,
        n.expanded ? h("span", { class: "chip blue" }, "expanded") : null,
        n.steps ? h("span", { class: "chip" }, "step " + n.steps) : null),
      n.via ? h("div", { class: "insp-line" }, h("b", null, "Matched by "), n.via, n.rrf ? ` \u00b7 score ${n.rrf}` : "") : null,
      n.signature ? h("div", { class: "insp-sig" }, n.signature) : null,
      n.summary ? h("p", { class: "insp-summary" }, n.summary) : null,
      n.asOf ? h("div", { class: "insp-asof" }, icon("clock", 12), "as of " + n.asOf) : null,
      h("div", { class: "insp-actions" },
        n.url ? h("a", { class: "btn btn-primary btn-sm", href: n.url, target: "_blank", rel: "noopener noreferrer" }, icon("external", 13), "Open on GitHub") : null,
        h("button", { type: "button", class: "btn btn-sm", onclick: () => focus(n) }, icon("target", 13), "Fly to"),
        h("button", { type: "button", class: "btn btn-sm", onclick: () => copyText(n.full, "Name copied") }, icon("copy", 13), "Copy name")),
      h("div", { class: "insp-sec" }, `Connections \u00b7 ${total}`),
      h("div", { class: "insp-conn" }, conn.length ? conn.map((c) =>
        h("div", { class: "insp-grp" },
          h("div", { class: "insp-rel" }, h("span", { class: "rel-badge " + c.kind }, c.type), c.undirected ? "related to" : c.out ? "points to" : "pointed to by", h("em", null, c.items.length)),
          c.items.slice(0, 8).map((it) => h("button", { type: "button", class: "insp-node", title: it.detail || it.other.full,
            onclick: () => select(it.other, true) }, h("i", { style: { background: it.other.color } }), it.other.name)),
          c.items.length > 8 ? h("div", { class: "insp-more" }, `+ ${c.items.length - 8} more`) : null)) : h("div", { class: "insp-more" }, "No visible relationships."))));
  }

  /* ---- toolbar actions */
  /* Frame the visible nodes. The camera keeps its viewing direction; the target moves to the middle of their projected extent and
     the camera backs off to the smallest distance at which every sphere fits inside the lens (with room left for the legend and
     toolbar). Closed form from node positions, the camera's own basis and its field of view: it never depends on an animation. */
  const v3 = { dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], len: (a) => Math.hypot(a[0], a[1], a[2]),
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; } };
  function fit(ms = 600) {
    const g = S.g;
    if (!g) return;
    S.userMoved = false;                                          // an explicit Fit (or any programmatic refit) resets the camera
    const W = box.clientWidth, H = box.clientHeight;
    const vis = S.data.nodes.filter((n) => nodeVisible(n) && n.x !== undefined);
    if (!vis.length || !W || !H) return;
    const flat = S.mode === "2d";
    const pts = vis.map((n) => ({ p: [n.x, n.y, flat ? 0 : n.z || 0], rad: Math.cbrt(n.val || 1) * REL_SIZE }));
    const cen = [0, 1, 2].map((i) => pts.reduce((s, q) => s + q.p[i], 0) / pts.length);
    const cam = g.camera(), c0 = g.cameraPosition();
    let dir = flat ? [0, 0, 1] : [c0.x - cen[0], c0.y - cen[1], c0.z - cen[2]];
    dir = v3.len(dir) < 1e-3 ? [0, 0, 1] : v3.norm(dir);           // camera exactly at the centre: look along -z
    const fwd = [-dir[0], -dir[1], -dir[2]];
    let right = v3.cross(fwd, [cam.up.x, cam.up.y, cam.up.z]);
    if (v3.len(right) < 1e-3) right = v3.cross(fwd, [0, 0, 1]);    // looking straight along the up axis
    right = v3.norm(right);
    const up = v3.cross(right, fwd);
    const co = pts.map((q) => { const v = [q.p[0] - cen[0], q.p[1] - cen[1], q.p[2] - cen[2]]; return { x: v3.dot(v, right), y: v3.dot(v, up), z: v3.dot(v, fwd), rad: q.rad }; });
    const mx = (Math.min(...co.map((c) => c.x - c.rad)) + Math.max(...co.map((c) => c.x + c.rad))) / 2;
    const my = (Math.min(...co.map((c) => c.y - c.rad)) + Math.max(...co.map((c) => c.y + c.rad))) / 2;
    const a = (cam.fov * Math.PI) / 360, b = Math.atan(Math.tan(a) * (W / H));     // half vertical and horizontal field of view
    const margin = 0.8;
    let dist = 60;
    for (const c of co) {
      dist = Math.max(dist, (Math.abs(c.x - mx) + c.rad) / (margin * Math.tan(b)) - c.z, (Math.abs(c.y - my) + c.rad) / (margin * Math.tan(a)) - c.z, -c.z + 20);
    }
    const target = [0, 1, 2].map((i) => cen[i] + right[i] * mx + up[i] * my);
    S.lastFit = { dist: Math.round(dist), W, H, fov: cam.fov, n: vis.length };
    g.cameraPosition({ x: target[0] + dir[0] * dist, y: target[1] + dir[1] * dist, z: target[2] + dir[2] * dist }, { x: target[0], y: target[1], z: target[2] }, ms);
  }
  function setSpin(on) {
    if (on && S.mode === "2d") return;
    S.spin = on;
    btnSpin.classList.toggle("on", on);
    if (on && S.g) { const p = S.g.cameraPosition(); S.radius = Math.max(60, Math.hypot(p.x, p.z)); S.angle = Math.atan2(p.x, p.z); }
  }
  function cycleLabels() {
    S.labelMode = S.labelMode === "auto" ? "all" : S.labelMode === "all" ? "none" : "auto";
    btnLabels.classList.toggle("on", S.labelMode === "all");
    setLabel(btnLabels, S.labelMode === "auto" ? "Labels" : S.labelMode === "all" ? "All labels" : "No labels");
  }
  function setMode(mode) {
    S.mode = mode;
    btnMode.classList.toggle("on", mode === "2d");
    setLabel(btnMode, mode === "2d" ? "3D view" : "2D map");
    btnMode.title = mode === "2d" ? "Back to the rotatable 3D view" : "Flatten the graph into a 2D map";
    root.classList.toggle("flat", mode === "2d");
    btnSpin.disabled = mode === "2d";
    setSpin(false);
    if (!S.g) return;
    S.g.numDimensions(mode === "2d" ? 2 : 3);
    const c = S.g.controls();
    if (c) c.noRotate = mode === "2d";
    S.fitted = false;
    S.g.graphData({ nodes: S.data.nodes, links: S.data.links });
    S.g.cameraPosition({ x: 0, y: 0, z: 400 }, { x: 0, y: 0, z: 0 }, 0);
    setTimeout(() => fit(500), 900);
    applyVisibility();
  }
  function toggleFull(force) {
    const on = force === undefined ? !root.classList.contains("full") : force;
    root.classList.toggle("full", on);
    document.body.classList.toggle("g3d-lock", on);
    btnFull.replaceChildren(icon(on ? "shrink" : "fit", 14), h("span", { class: "lbl" }, on ? "Close" : "Expand"));
    resize();
    setTimeout(() => fit(400), 120);
  }
  function setSteps(set) {
    S.stepSel = set ? new Set(set) : null;
    applyVisibility();
    if (opts.onStepsChange) opts.onStepsChange(S.stepSel);
  }
  function setHidden(label, off) {
    off ? S.hidden.add(label) : S.hidden.delete(label);
    applyVisibility();
  }

  /* Replay: the graph grows outward from the question, one tool call at a time and one hop at a time, the way the agent walked it. */
  async function replay() {
    const order = (opts.stepsOrder || []).filter((s) => !S.stepSel || S.stepSel.has(s));
    if (!order.length || !S.g || S.replaying) return;
    S.replaying = true;
    btnReplay.classList.add("on");
    btnReplay.replaceChildren(icon("pause", 14), h("span", { class: "lbl" }, "Stop"));
    setSpin(false);
    select(null);
    S.revealed = new Set(["question"]);
    applyVisibility();
    fit(0);
    for (let i = 0; i < order.length && S.replaying && !S.dead; i++) {
      const s = order[i];
      const caption = `Step ${i + 1} of ${order.length} \u00b7 ${(opts.stepLabels || {})[s] || "tool call " + s}`;
      replayCaption.textContent = caption;
      replayCaption.classList.add("show");
      await sleep(900);
      const edges = S.data.links.filter((l) => l.stepList.includes(s));
      const remaining = new Set(S.data.nodes.filter((n) => n.stepList.includes(s) && !S.revealed.has(n.id) && !S.hidden.has(n.label)).map((n) => n.id));
      let frontier = new Set(S.revealed);
      while (remaining.size && S.replaying && !S.dead) {
        const layer = new Set();
        for (const l of edges) {
          const a = end(l.source).id, b = end(l.target).id;
          if (frontier.has(a) && remaining.has(b)) layer.add(b);
          if (frontier.has(b) && remaining.has(a)) layer.add(a);
        }
        if (!layer.size) remaining.forEach((id) => layer.add(id));        // not linked to anything shown yet: bring them in together
        layer.forEach((id) => { remaining.delete(id); S.revealed.add(id); S.flash.add(id); });
        frontier = layer;
        applyVisibility();
        applyStyles();
        fit(600);
        const fresh = [...layer];
        setTimeout(() => { fresh.forEach((id) => S.flash.delete(id)); applyStyles(); }, 1400);
        await sleep(900);
      }
    }
    if (S.replaying && !S.dead) { replayCaption.textContent = "That is every node and relationship the agent touched."; await sleep(1300); }
    stopReplay(true);
  }
  function stopReplay(finished) {
    if (!S.replaying && !finished) return;
    S.replaying = false;
    S.revealed = null;
    S.flash.clear();
    btnReplay.classList.remove("on");
    btnReplay.replaceChildren(icon("play", 14), h("span", { class: "lbl" }, "Replay"));
    replayCaption.classList.remove("show");
    if (S.g) { applyVisibility(); applyStyles(); fit(500); }
  }

  /* ---- legend, labels, search */
  function buildLegend() {
    legend.replaceChildren();
    for (const item of data.legend) {
      const b = h("button", { type: "button", class: "g3d-key", "data-label": item.label, title: `Show or hide ${item.label} nodes`,
        onclick: () => setHidden(item.label, !S.hidden.has(item.label)) },
        h("span", { style: { background: item.color } }), item.label, h("em", null, item.count));
      legend.append(b);
    }
  }
  function buildLabels() {
    labelLayer.replaceChildren();
    S.labels = new Map();
    for (const n of data.nodes) {
      const el = h("div", { class: "g3d-label" + (n.hit ? " hit" : "") + (n.question ? " question" : "") }, n.name);
      labelLayer.append(el);
      S.labels.set(n, el);
    }
  }
  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    S.match = null;
    found.textContent = "";
    if (q) {
      S.match = new Set(data.nodes.filter((n) => `${n.full} ${n.label} ${n.repo || ""} ${n.path || ""}`.toLowerCase().includes(q)).map((n) => n.id));
      found.textContent = S.match.size ? `${S.match.size}` : "0";
      found.classList.toggle("none", !S.match.size);
    }
    applyStyles();
  });
  search.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && S.match && S.match.size) { const n = S.byId.get([...S.match][0]); select(n, true); }
    if (e.key === "Escape") { search.value = ""; search.dispatchEvent(new Event("input")); search.blur(); }
  });

  function tick() {
    const g = S.g;
    if (!g || S.dead) return;
    if (S.spin) {
      S.angle += 0.004;
      g.cameraPosition({ x: S.radius * Math.sin(S.angle), z: S.radius * Math.cos(S.angle) });
    }
    const camera = g.camera();
    const m = camera.matrixWorldInverse.elements;
    const focal = box.clientHeight / 2 / Math.tan((camera.fov * Math.PI) / 360);
    const f = focusNode();
    for (const [n, el] of S.labels) {
      const eligible = S.labelMode === "all" || (S.labelMode === "auto" && (n.prominent || S.visCount <= 25)) || n === S.selected || n === S.hover;
      const visible = eligible && n.x !== undefined && nodeVisible(n);
      const depth = visible ? m[2] * n.x + m[6] * n.y + m[10] * n.z + m[14] : 1;
      if (depth > 0 && S.mode === "3d" || !visible) { el.style.display = "none"; continue; }
      const p = g.graph2ScreenCoords(n.x, n.y, n.z);
      const radius = S.mode === "3d" ? (Math.cbrt(n.val || 1) * REL_SIZE * focal) / -depth : 6;
      el.style.display = "";
      el.style.transform = `translate(${Math.round(p.x + radius + 4)}px, ${Math.round(p.y - 7)}px)`;
      el.classList.toggle("dim", !!f && !S.hlN.has(n) || !f && !!S.match && !S.match.has(n.id));
      el.classList.toggle("sel", n === S.selected);
    }
    if (!S.frozen) S.raf = requestAnimationFrame(tick);
  }

  function resize() {
    if (!S.g) return;
    const w = box.clientWidth;
    if (!w) { S.wasHidden = true; return; }                // collapsed step: nothing to size yet
    const resized = Math.abs(w - (S.lastW || 0)) > 24 || Math.abs(box.clientHeight - (S.lastH || 0)) > 24;
    S.lastW = w; S.lastH = box.clientHeight;
    S.g.width(w).height(box.clientHeight);
    if (S.wasHidden || (resized && S.fitted && !S.userMoved && !S.replaying)) {    // reopened or resized and untouched: frame it again
      S.wasHidden = false;
      clearTimeout(S.refitTimer);
      S.refitTimer = setTimeout(() => fit(0), 80);
    }
  }

  /* ---- boot */
  buildLegend();
  buildLabels();
  const api = { el: root, select: (id) => select(S.byId.get(id), true), fit, setSteps, setHidden, setSpin, focus, replay, stopReplay, resize,
    nodes: data.nodes, state: S, destroy() {
      S.dead = true;
      cancelAnimationFrame(S.raf);
      stopReplay();
      document.body.classList.remove("g3d-lock");
      if (S.observer) S.observer.disconnect();
      if (S.g) {
        try {
          S.g.pauseAnimation();
          const r = S.g.renderer();
          if (S.g._destructor) S.g._destructor();
          r.dispose();
          r.forceContextLoss();
        } catch (e) { /* the scene was already gone */ }
        S.g = null;
      }
    } };

  if (!hasWebGL()) {
    msg.textContent = "This browser could not start WebGL, so the 3D view is unavailable. The Nodes and Relationships tables below list the same graph.";
    return api;
  }
  loadLibrary(opts.lib).then((ForceGraph3D) => {
    if (S.dead) return;
    const g = ForceGraph3D({ controlType: "trackball" })(box);
    S.g = g;
    g.backgroundColor("#F4F8FC").showNavInfo(false).nodeRelSize(REL_SIZE).nodeOpacity(0.95).nodeResolution(18)
      .nodeVal((n) => n.val).nodeLabel(nodeTip).linkLabel(linkTip).linkOpacity(0.65).linkCurvature(0.06)
      .linkDirectionalArrowLength((l) => (l.kind === "context" || l.undirected ? 0 : 3.5)).linkDirectionalArrowRelPos(1)
      .linkDirectionalParticleWidth(1.8).linkDirectionalParticleSpeed(0.006)
      .onNodeHover((n) => { if ((n || null) === S.hover) return; S.hover = n || null; box.style.cursor = n ? "pointer" : ""; refresh(); })
      .onNodeClick((n) => {
        const now = Date.now();
        if (S.lastClick && S.lastClick.id === n.id && now - S.lastClick.t < 450) { S.lastClick = null; openNode(n); return; }
        S.lastClick = { id: n.id, t: now };
        select(n);
      })
      .onNodeRightClick((n) => focus(n))
      .onBackgroundClick(() => select(null))
      .onEngineStop(() => { if (!S.fitted) { S.fitted = true; fit(600); if (!opts.static) document.documentElement.dataset.graphReady = "1"; } });
    if (opts.static) g.warmupTicks(220).cooldownTicks(0).cooldownTime(0);
    else g.cooldownTicks(160);
    msg.remove();
    S.observer = new ResizeObserver(resize);
    S.observer.observe(box);
    resize();
    box.addEventListener("pointerdown", () => { setSpin(false); S.userMoved = true; }, true);
    box.addEventListener("wheel", () => { S.userMoved = true; }, { capture: true, passive: true });
    refresh();
    g.graphData({ nodes: data.nodes, links: data.links });
    applyVisibility();
    if (opts.static) {                       // screenshots: lay out, draw one settled frame, then stop every animation loop
      setTimeout(() => {
        fit(0);
        setTimeout(() => { S.frozen = true; g.pauseAnimation(); document.documentElement.dataset.graphReady = "1"; }, 700);
      }, 400);
    }
    tick();
    if (opts.onReady) opts.onReady(api);
  }).catch((err) => {
    msg.textContent = `The 3D view could not start (${err.message}). The Nodes and Relationships tables below list the same graph.`;
  });

  function nodeTip(n) {
    return `<div class="tip"><b>${esc(n.full)}</b><br>${esc(n.label)}${n.repo ? " \u00b7 " + esc(n.repo) : ""}${n.path ? "<br>" + esc(n.path) : ""}`
      + `${n.hit ? "<br>search hit #" + n.hit + (n.via ? " via " + esc(n.via) : "") : ""}${n.summary ? "<br>" + esc(clip(n.summary, 160)) : ""}`
      + `${n.steps ? "<br><i>step " + esc(n.steps) + "</i>" : ""}<br><i>click for details${n.url ? " \u00b7 double-click opens GitHub" : ""}</i></div>`;
  }
  function linkTip(l) {
    const a = end(l.source), b = end(l.target);
    return `<div class="tip"><b>${esc(l.type)}</b><br>${esc(a && a.full)} ${l.undirected ? "\u2194" : "\u2192"} ${esc(b && b.full)}${l.detail ? "<br>" + esc(l.detail) : ""}`
      + `<br><i>${esc(EDGE_TIP[l.kind] || "")}${l.undirected ? " (direction not reported)" : ""} \u00b7 step ${esc(l.steps)}</i></div>`;
  }
  return api;
}

"use strict";

function table(cols, rows, opts = {}) {

  return h("div", { class: "tbl-wrap" + (opts.tall ? " tall" : "") },
    h("table", { class: "tbl" },

function tabs(items, state) {

/* a numbered step card whose body is built when it is first opened */
function stepCard(n, ic, title, meta, state, key, build) {
  const body = h("div", { class: "tstep-body" });
  let built = false;
  const card = h("section", { class: "tstep" + (state.open[key] ? " open" : ""), id: "tstep-" + n });
  const setOpen = (on) => {

  };
  const toggle = () => setOpen(!state.open[key]);

    h("span", { class: "tstep-n" }, String(n)),

    h("span", { class: "tstep-title" }, title, meta ? h("em", null, meta) : null),

function metric(label, value, tone) {
  return h("div", { class: "metric" + (tone ? " " + tone : "") }, h("div", { class: "metric-v" }, String(value)), h("div", { class: "metric-l" }, label));

function nodeLink(name, url, label) {

/* ---------------------------------------------------------------- insight card (the figures the server's analytics return) */
const GITHUB_URL = /^https:\/\/github\.com\//;
function humanize(key) { return String(key).replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase()); }

function colLabel(key) { return COL_LABELS[key] || humanize(key); }
function fmtCell(v) {
  if (v == null || v === "") return "\u2014";
  if (typeof v === "string") return GITHUB_URL.test(v) ? h("a", { href: v, target: "_blank", rel: "noopener noreferrer" }, "Open \u2197") : clip(v, 110);
  if (typeof v === "number") return Number.isInteger(v) ? num(v) : String(Math.round(v * 100) / 100);
  if (typeof v === "boolean") return v ? "yes" : "no";
  if (Array.isArray(v)) {
    if (!v.length) return "\u2014";

      return h("span", null, h("a", { href: v[0], target: "_blank", rel: "noopener noreferrer" }, "Open \u2197"), v.length > 1 ? ` +${v.length - 1}` : "");

    }

}
function insightCard(ins, opts = {}) {
  const rows = ins.rows || [];

/* ---------------------------------------------------------------- citations (also used under each answer) */

/* ---------------------------------------------------------------- step timeline shown under each answer */
function timelineOf(turn) {
  const v = turn.trace.verification || {};
  const out = [turn.route === "library"
    ? { ic: "lightbulb", label: "Picked from the question library", caption: `Matched the **${(turn.insight || {}).title || "insight"}** analytics, which covers the whole graph`, state: "complete" }
    : { ic: "route", label: "Understood the question", caption: `Routed as a **${turn.route}** question \u00b7 ${turn.router_hint || ""}`, state: "complete" }];
  for (const s of turn.steps) {
    out.push({ ic: toolIcon(s), label: toolLabel(s.tool, s.summary, s.label),
      caption: `\`${toolCall(s.tool, s.args)}\` \u00b7 ${num(s.ms)} ms` + (s.error ? ` \u00b7 error: ${clip(s.error, 160)}` : ""), state: s.error ? "error" : "complete" });
  }

/* ---------------------------------------------------------------- the panel */
function contextMessages(turn) {
  const msgs = [];
  msgs.push({ role: "system", what: "Working rules: how to work and answer", text: turn.trace.system_prompt || "", lang: null });
  const note = turn.route === "library" ? "Question + library note" : "Question + router hint";
  msgs.push({ role: "user", what: turn.history_turns ? `${note} (earlier turns are in the chat)` : note, text: turn.trace.user_message || turn.question, lang: null });
  const waves = new Map();
  for (const s of turn.steps) { if (!waves.has(s.turn)) waves.set(s.turn, []); waves.get(s.turn).push(s); }
  for (const steps of waves.values()) {
    const plan = JSON.stringify(steps.map((s) => ({ tool: s.tool, args: s.args })), null, 2);
    msgs.push({ role: "assistant", what: "Plan: " + steps.map((s) => s.tool).join(", "), text: plan, lang: "json" });
    for (const s of steps) {
      const p = prettyJson(s.text);
      msgs.push({ role: "tool", what: `Tool result \u00b7 step ${s.index} ${s.tool}${s.truncated ? " (cut at 14,000)" : ""}`, text: p.text, lang: p.lang, chars: s.chars });
    }
  }
  msgs.forEach((m, i) => { m.n = i + 1; if (m.chars == null) m.chars = m.text.length; });

}

function renderTrace(turn, ctx) {
  const ui = ctx.ui;

  let graph = null;
  const msgs = contextMessages(turn);

      badge(plural(sg.edges.length, "relationship"), "route"),

  /* ---- 1 understand */
  const understand = () => {
    const wrap = h("div", { class: "stack" });

    wrap.append(h("p", { class: "lede" }, library
      ? "The question is one from the question library, which maps it to a fixed insight analytics over the whole graph. The agent runs that first (through graphrag_context) and answers from its figures; it may still call more tools."
      : "A keyword router tags the question and adds a hint to it; the agent then chooses the graph tools and the filters to pass them."));

      { label: "Argument", get: (r) => h("code", null, r.arg) },
      { label: "Value", get: (r) => h("span", { class: "val" }, clip(valueText(r.value), 140)) },
      { label: "Role", get: (r) => chip(r.arg === TARGET_ARGS[r.s.tool] ? "target" : "filter", r.arg === TARGET_ARGS[r.s.tool] ? "blue" : "") },
      { label: "How it is applied", get: (r) => ((FILTER_NOTES[r.s.tool] || {})[r.arg]) || (r.arg === TARGET_ARGS[r.s.tool] ? "what the tool looks up" : "") },
    ], rows));

  /* ---- 2 retrieve */
  const nodesOfStep = (s) => sg.nodes.filter((n) => n.steps.includes(s.index) && !["Question", "Search", "Query", "GitHub", "Agent"].includes(n.label));
  const hitsTable = (view) => {
    const hits = view.hits || [];
